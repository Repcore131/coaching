<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RepCore : page introuvable</title>
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#080808">
<link rel="icon" href="/app/icons/icon-192x192.png">
<!--
  Sans ce fichier, une adresse inconnue affichait la page blanche de Firebase
  (« Page Not Found », logo Firebase, conseils sur firebase.json). Un athlete
  a qui on envoie un lien y voit une panne, et s'arrete la. On lui donne au
  moins les deux portes : l'app, et la page de presentation.
-->
<style>
body{margin:0;background:#080808;color:#f2f2f2;
  font:16px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;
  min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px 16px}
.boite{max-width:460px;width:100%;text-align:center}
img{width:64px;height:64px;border-radius:16px;margin-bottom:18px}
h1{font-size:22px;margin:0 0 10px}
p{color:#a8a8a8;margin:0 0 20px}
a.bouton{display:block;text-decoration:none;background:#c9f24d;color:#0a0a0a;font-weight:700;
  padding:15px 18px;border-radius:12px;margin:8px 0}
a.sec{background:transparent;color:#f2f2f2;border:1px solid #2a2a2a;font-weight:600}
</style>
</head>
<body>
<div class="boite">
  <img src="/app/icons/icon-192x192.png" alt="RepCore">
  <h1>Cette page n'existe pas</h1>
  <p>Le lien est peut-être incomplet. Tout l'accès RepCore se trouve ici :</p>
  <a class="bouton" href="/app/">Ouvrir l'application</a>
  <a class="bouton sec" href="/">Découvrir RepCore</a>
</div>
</body>
</html>
