# ══════════════════════════════════════════════════════════════════════════
#  LES PLANS PAYPAL : CE QU'ILS FACTURENT, ET CE QUI MANQUE
# ══════════════════════════════════════════════════════════════════════════
#
#  POURQUOI ICI, ET PAS SUR LE POSTE DE KEVIN. Ces commandes ont besoin du
#  secret de l'application PayPal. Le taper dans une session assistee, c'est le
#  faire transiter par une conversation ; le poser en variable d'environnement,
#  c'est le laisser dans un historique de shell. Ici, il vit dans les secrets du
#  depot : GitHub l'injecte dans le processus, le masque dans les journaux, et
#  personne ne le lit jamais — pas meme celui qui declenche le travail.
#
#  ── LE SECRET, UNE FOIS ────────────────────────────────────────────────
#  Depot > Settings > Secrets and variables > Actions > New repository secret
#      PAYPAL_CLIENT_SECRET   le secret de l'application PayPal (compte reel)
#  C'est le MEME que celui du rapport payeur : si tu l'as deja pose, il n'y a
#  rien a faire. Pose par Kevin le 24/09/2026 — le rapport payeur du 1er du
#  mois en depend aussi, et il ne pouvait donc pas partir avant.
#
#  PAYPAL_CLIENT_ID n'est pas un secret : le script le lit dans rc-core, ou il
#  vit en clair — chaque page servie le contient.
#
#  ⚠ CE TRAVAIL ECRIT CHEZ PAYPAL. Il cree les plans manquants (et seulement
#    eux : avant d'en creer un, le script liste les existants et reutilise
#    celui qui porte le meme nom). Il ne supprime rien, ne desactive rien, et
#    ne touche a aucun abonnement en cours.
#
#  ⚠ CE QU'IL NE FAIT PAS : ecrire les identifiants dans rc-core. Ils sont
#    AFFICHES dans le journal, et recopies a la main dans le code, avec un
#    numero de build. Une machine qui modifie le code source de l'application
#    au milieu d'un travail programme, c'est une modification que personne
#    n'a relue.
#
#  ⚠ IL LAISSE UNE TRACE LISIBLE SANS COMPTE GITHUB : le releve est ecrit dans
#    docs/offre/etat-plans-paypal.md et commite. Les journaux d'Actions
#    demandent une connexion ; un fichier du depot, non. C'est la qu'on lit les
#    identifiants des plans crees, et c'est ce qui permet de relire dans six
#    mois ce que PayPal facturait ce jour-la. Le commit porte [skip ci] : il ne
#    redeclenche aucun deploiement.
# ══════════════════════════════════════════════════════════════════════════
name: Plans PayPal

on:
  # A LA DEMANDE : onglet Actions > Plans PayPal > Run workflow.
  workflow_dispatch:
  # ET A CHAQUE FOIS QUE LE SCRIPT OU CE FICHIER CHANGE : c'est le moment ou
  # une formule neuve apparait, donc le moment ou un plan manque.
  push:
    paths:
      - 'scripts/paypal_plans.mjs'
      - '.github/workflows/plans-paypal.yml'

permissions:
  contents: write

concurrency:
  group: plans-paypal
  cancel-in-progress: false

jobs:
  plans:
    runs-on: ubuntu-latest
    steps:
      # fetch-depth 0 : l'etape finale fait un pull --rebase, impossible sur
      # un clone superficiel.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── LE SECRET D'ABORD : sans lui, tout le reste ment ─────────────
      # Sans cette etape, les trois suivantes tombent en six secondes sur une
      # erreur de saisie et personne ne comprend que c'est un secret qui
      # manque, pas PayPal qui refuse.
      #
      # ⚠ ET IL DIT QUELS SECRETS IL VOIT, PAR LEUR NOM. Un secret pose au
      #   mauvais endroit — onglet Dependabot, onglet Codespaces, secret
      #   d'environnement — n'arrive jamais ici, et « il n'existe pas » est
      #   alors un message qui ment a celui qui vient de le poser. La liste des
      #   NOMS tranche en une seconde.
      #
      #   ⚠⚠ LES NOMS, ET RIEN QUE LES NOMS. `toJSON(secrets)` porte AUSSI les
      #      valeurs. Le journal les masque, mais le fichier qu'on commite,
      #      LUI, ne masque rien et ce depot est public : on passe donc par
      #      Object.keys, et la valeur ne sort jamais de la variable.
      - name: Le secret est-il pose
        env:
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          TOUS_LES_SECRETS: ${{ toJSON(secrets) }}
        run: |
          mkdir -p docs/offre
          R=docs/offre/etat-plans-paypal.md
          NOMS=$(node -e 'const o=JSON.parse(process.env.TOUS_LES_SECRETS||"{}");
            const k=Object.keys(o).filter(x=>x!=="github_token");
            console.log(k.length?k.sort().join(", "):"(aucun)")')
          {
            echo "# L'etat des plans PayPal"
            echo
            echo "Releve du $(date -u +'%d/%m/%Y a %H:%M UTC'), ecrit par le travail"
            echo "« Plans PayPal » (.github/workflows/plans-paypal.yml)."
            echo
            echo '## Les secrets que ce travail voit'
            echo
            echo 'Leurs NOMS seulement : une valeur ecrite ici partirait dans un depot public.'
            echo
            echo '```'
            echo "$NOMS"
            echo '```'
          } > $R
          echo "Secrets vus : $NOMS"
          if [ -z "$PAYPAL_CLIENT_SECRET" ]; then
            {
              echo
              echo '## PAYPAL_CLIENT_SECRET manque'
              echo
              echo "Ce travail ne voit pas de secret de ce nom. S'il vient d'etre pose,"
              echo "c'est qu'il l'a ete ailleurs que dans **Settings > Secrets and variables"
              echo "> Actions > Repository secrets** : l'onglet Dependabot et l'onglet"
              echo "Codespaces ont leurs propres listes, et un secret d'environnement ne"
              echo "descend que dans un travail qui declare cet environnement."
              echo
              echo "Les noms ci-dessus sont ceux qui arrivent vraiment jusqu'ici."
            } >> $R
            echo "::error::Le secret PAYPAL_CLIENT_SECRET n'arrive pas jusqu'a ce travail. Secrets vus : $NOMS"
            exit 1
          fi
          echo "Secret present."

      # ── 1, 2, 3 : L'ETAT, LA CREATION, L'ETAT ────────────────────────
      # Tout dans une seule etape, parce que tout part dans le MEME releve.
      # Le premier appel echoue par construction quand un plan manque : c'est
      # ce qu'on vient chercher, d'ou le `|| true`. Le dernier, lui, decide de
      # la couleur du travail.
      - name: Regarder, creer, regarder a nouveau
        env:
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          R=docs/offre/etat-plans-paypal.md
          {
            echo
            echo '## Avant'
            echo
            echo '```'
          } >> $R
          node scripts/paypal_plans.mjs --verifier 2>&1 | tee -a $R || true
          {
            echo '```'
            echo
            echo '## Ce qui a ete cree'
            echo
            echo '```'
          } >> $R
          node scripts/paypal_plans.mjs 2>&1 | tee -a $R
          {
            echo '```'
            echo
            echo '## Apres'
            echo
            echo '```'
          } >> $R
          node scripts/paypal_plans.mjs --verifier 2>&1 | tee -a $R && OK=1 || OK=0
          echo '```' >> $R
          [ "$OK" = 1 ]

      # ── ET LE RELEVE RESTE DANS LE DEPOT ─────────────────────────────
      # `always` : un releve qui ne survit qu'aux jours ou tout va bien ne sert
      # a rien, c'est les autres jours qu'on le lit.
      - name: Garder le releve
        if: always()
        run: |
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add docs/offre/etat-plans-paypal.md || true
          git diff --cached --quiet && { echo 'rien de neuf'; exit 0; }
          git commit -m 'Releve des plans PayPal [skip ci]'
          for i in 1 2 3; do
            git pull --rebase --quiet && git push --quiet && exit 0
            echo "push refuse, nouvel essai ($i)"
            sleep 5
          done
          exit 1
