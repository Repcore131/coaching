# ══════════════════════════════════════════════════════════════════════════
#  LES PLANS PAYPAL : CE QU'ILS FACTURENT, ET CE QUI MANQUE
# ══════════════════════════════════════════════════════════════════════════
#
#  POURQUOI ICI, ET PAS SUR LE POSTE DE KEVIN. Ces commandes ont besoin du
#  secret de l'application PayPal. Le taper dans une session assistee, c'est le
#  faire transiter par une conversation ; le poser en variable d'environnement,
#  c'est le laisser dans un historique de shell. Ici, il vit dans les secrets du
#  depot : GitHub l'injecte dans le processus, le masque dans les journaux, et
#  personne ne le lit jamais — pas meme celui qui declenche le travail.
#
#  ── LE SECRET, UNE FOIS ────────────────────────────────────────────────
#  Depot > Settings > Secrets and variables > Actions > New repository secret
#      PAYPAL_CLIENT_SECRET   le secret de l'application PayPal (compte reel)
#  C'est le MEME que celui du rapport payeur : si tu l'as deja pose, il n'y a
#  rien a faire.
#
#  ⚠ TROIS ENDROITS SE RESSEMBLENT ET NE COMMUNIQUENT PAS. Sur la meme page,
#    l'onglet « Actions » a sa liste, l'onglet « Dependabot » la sienne,
#    l'onglet « Codespaces » la sienne ; et sous « Actions », les secrets
#    d'ENVIRONNEMENT ne descendent que dans un travail qui declare cet
#    environnement. Un secret pose dans le mauvais n'arrive jamais ici. La
#    premiere etape dit lequel des six noms attendus lui parvient vraiment.
#    Les trois MAIL_* y figurent aussi, bien qu'ils ne servent pas ici : c'est
#    le rapport payeur du 1er du mois qui en depend, et une seule table vaut
#    mieux que deux travaux a declencher pour savoir ou on en est.
#
#  PAYPAL_CLIENT_ID n'est pas un secret : le script le lit dans rc-core, ou il
#  vit en clair — chaque page servie le contient.
#
#  ⚠ CE TRAVAIL ECRIT CHEZ PAYPAL. Il cree les plans manquants (et seulement
#    eux : avant d'en creer un, le script liste les existants et reutilise
#    celui qui porte le meme nom). Il ne supprime rien, ne desactive rien, et
#    ne touche a aucun abonnement en cours.
#
#  ⚠ CE QU'IL NE FAIT PAS : ecrire les identifiants dans rc-core. Ils
#    apparaissent dans le RESUME du travail, et sont recopies a la main dans le
#    code, avec un numero de build. Une machine qui modifie le code source de
#    l'application au milieu d'un travail programme, c'est une modification que
#    personne n'a relue.
#
#  ⚠ ET RIEN N'EST COMMITE. Un premier jet ecrivait son releve dans
#    docs/offre/ — dossier volontairement hors du depot — puis le committait :
#    l'etape passait au vert sans que rien ne soit jamais enregistre. Tout
#    passe maintenant par le resume du travail, qui se lit dans l'onglet
#    Actions sans rien publier ni rien ecrire dans le depot.
# ══════════════════════════════════════════════════════════════════════════
name: Plans PayPal

on:
  # A LA DEMANDE : onglet Actions > Plans PayPal > Run workflow.
  workflow_dispatch:
  # ET A CHAQUE FOIS QUE LE SCRIPT OU CE FICHIER CHANGE : c'est le moment ou
  # une formule neuve apparait, donc le moment ou un plan manque.
  push:
    paths:
      - 'scripts/paypal_plans.mjs'
      - '.github/workflows/plans-paypal.yml'

permissions:
  contents: read

concurrency:
  group: plans-paypal
  cancel-in-progress: false

jobs:
  plans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ── LE SECRET D'ABORD : sans lui, tout le reste ment ─────────────
      # Sans cette etape, les appels suivants tombent sur une erreur de saisie
      # et personne ne comprend que c'est un secret qui manque, pas PayPal qui
      # refuse.
      #
      # ⚠ ON NE DEMANDE JAMAIS LA TABLE ENTIERE DES SECRETS. Essaye le
      #   24/09/2026 : GitHub a marque le fichier « may be malicious » et
      #   bloque le travail jusqu'a approbation — et il a raison, c'est le
      #   motif exact d'une exfiltration. Ce qui suit n'est pas une valeur mais
      #   une COMPARAISON par nom : elle rend true ou false, et aucune valeur
      #   ne prend jamais corps nulle part.
      - name: Le secret est-il pose
        env:
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
          VU_PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET != '' }}
          VU_PAYPAL_SECRET: ${{ secrets.PAYPAL_SECRET != '' }}
          VU_PAYPAL_CLIENT_ID: ${{ secrets.PAYPAL_CLIENT_ID != '' }}
          VU_MAIL_UTILISATEUR: ${{ secrets.MAIL_UTILISATEUR != '' }}
          VU_MAIL_MOT_DE_PASSE: ${{ secrets.MAIL_MOT_DE_PASSE != '' }}
          VU_MAIL_DESTINATAIRE: ${{ secrets.MAIL_DESTINATAIRE != '' }}
        run: |
          {
            echo '## Les secrets qui arrivent jusqu ici'
            echo
            echo 'Une ligne par nom attendu. Aucune valeur ne figure ici.'
            echo
            echo '| nom | etat |'
            echo '| --- | --- |'
          } >> $GITHUB_STEP_SUMMARY
          for n in PAYPAL_CLIENT_SECRET PAYPAL_SECRET PAYPAL_CLIENT_ID \
                   MAIL_UTILISATEUR MAIL_MOT_DE_PASSE MAIL_DESTINATAIRE; do
            eval "v=\$VU_$n"
            if [ "$v" = "true" ]; then e='pose'; else e='**absent**'; fi
            echo "| $n | $e |" >> $GITHUB_STEP_SUMMARY
            echo "$n : $e"
          done
          if [ -z "$PAYPAL_CLIENT_SECRET" ]; then
            {
              echo
              echo '### PAYPAL_CLIENT_SECRET n arrive pas jusqu ici'
              echo
              echo 'Il a ete pose ailleurs que dans **Settings > Secrets and variables >'
              echo 'Actions > Repository secrets** de ce depot : les onglets Dependabot et'
              echo 'Codespaces ont leurs propres listes, un secret d environnement ne'
              echo 'descend que dans un travail qui declare cet environnement, et un autre'
              echo 'depot est un autre monde.'
            } >> $GITHUB_STEP_SUMMARY
            echo "::error::PAYPAL_CLIENT_SECRET n'arrive pas jusqu'a ce travail (voir le resume)."
            exit 1
          fi
          echo "Secret present."

      # ── 1, 2, 3 : L'ETAT, LA CREATION, L'ETAT ────────────────────────
      # Tout dans une seule etape, parce que tout part dans le MEME resume.
      # Le premier appel echoue par construction quand un plan manque : c'est
      # ce qu'on vient chercher, d'ou le `|| true`. Le dernier, lui, decide de
      # la couleur du travail.
      - name: Regarder, creer, regarder a nouveau
        env:
          PAYPAL_CLIENT_SECRET: ${{ secrets.PAYPAL_CLIENT_SECRET }}
        run: |
          S=$GITHUB_STEP_SUMMARY
          { echo; echo '## Avant'; echo; echo '```'; } >> $S
          node scripts/paypal_plans.mjs --verifier 2>&1 | tee -a $S || true
          { echo '```'; echo; echo '## Ce qui a ete cree'; echo; echo '```'; } >> $S
          node scripts/paypal_plans.mjs 2>&1 | tee -a $S
          { echo '```'; echo; echo '## Apres'; echo; echo '```'; } >> $S
          node scripts/paypal_plans.mjs --verifier 2>&1 | tee -a $S && OK=1 || OK=0
          echo '```' >> $S
          [ "$OK" = 1 ]
