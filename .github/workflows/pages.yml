# GitHub Pages : repcore131.github.io/coaching/
#
# ⚠ JUSQU'AU 01/10/2026, CE TRAVAIL PUBLIAIT LE DÉPÔT ENTIER (path: .) :
#   scripts, règles de la base, code du Worker, docs/ (les plans), android/…
#   tout était lisible à repcore131.github.io/coaching/<chemin>.
#
# CE QUI EST PUBLIÉ, désormais : le site public assemblé par
# scripts/fabriquer_site.mjs — LA MÊME LISTE que Firebase Hosting — plus
# l'appli VAULT construite (servie seulement ici).
#
# POURQUOI PAS vault/ SEUL : le sitemap, robots.txt, les balises canonical et
# les images d'aperçu (og:image) de la page de vente, du blog et de l'app
# désignent encore repcore131.github.io/coaching/. Les retirer d'ici casserait
# les aperçus partagés et les liens déjà donnés. Passer tout sur
# repcore-sync.web.app est un choix à faire à part (et ce travail ne
# publierait plus alors que vault/).
name: Deployer les Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# LE GROUPE A CHANGE DE NOM LE 01/10/2026. Un deploiement du 30/09 (run 36763599481) est
# reste « en attente » sans jamais demarrer : avec cancel-in-progress a false, tous les
# suivants faisaient la queue derriere lui puis etaient annules, et les Pages sont restees
# au build 1743 pendant onze builds. Nouveau groupe : plus rien n'attend derriere ce run.
# cancel-in-progress a true : le dernier push gagne, un deploiement bloque ne bloque plus.
concurrency:
  group: pages-deploiement
  cancel-in-progress: true
jobs:
  deployer:
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # L'HISTORIQUE SANS LES CONTENUS : scripts/sitemap.mjs (appelé par
      # fabriquer_site.mjs) date chaque page par son dernier commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # ⚠ ON NE PUBLIE PLUS LE DEPOT ENTIER (05/10/2026). « path: . » mettait en
      #   ligne tests.js, scripts/, cloudflare/, database.rules.json, docs/ et
      #   toutes les notes de travail. Le site est assemble par le meme script
      #   que pour Firebase (une seule liste), plus ce que SEULES les Pages
      #   servent : l'appli VAULT construite.
      - name: Assembler le site
        run: |
          set -e
          node scripts/fabriquer_site.mjs _pages --pages
          test -f _pages/index.html
          test -f _pages/app/index.html
          test -f _pages/vault/app/index.html
          test ! -f _pages/app/tests.js
          test ! -e _pages/scripts
          test ! -e _pages/database.rules.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _pages
      - id: deploiement
        uses: actions/deploy-pages@v4
