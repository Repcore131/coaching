# Deploiement de sync.web.app depuis GitHub, sans machine locale.
#
# POURQUOI CE FICHIER EXISTE. Le dossier _site que firebase.json publie est
# dans .gitignore : il n'a jamais vecu que sur un disque, et ce disque a ete
# perdu. On le reassemble donc ICI, a chaque deploiement, a partir des seuls
# fichiers presents dans le depot — la source de verite.
#
# CE QUI ENTRE DANS _site : les pages publiques, l'app, le blog, les images.
# CE QUI N'Y ENTRE PAS, deliberement : functions/, scripts/, docs/, les notes
# de travail et database.rules.json. Rien de tout cela n'a a etre servi par
# l'hebergement — et un deploiement REMPLACE le site entier.
name: Deployer sur Firebase Hosting

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      # ⚠ 'scripts/**' A QUITTE CETTE LISTE (05/10/2026) : fabriquer_site.mjs et
      #   minifier.mjs decident du fichier servi. Les ignorer aurait laisse une
      #   correction de la fabrication dans le depot sans jamais la publier.
      - 'docs/**'
      # VAULT (appli d'épargne) n'est pas servie par Firebase : GitHub Pages la publie.
      - 'vault/**'
      # ⚠ 'functions/**' A QUITTE CETTE LISTE (lot 0). Les fonctions sont
      #   desormais deployees par ce meme workflow : les ignorer aurait laisse
      #   une correction de fonction dans le depot sans jamais la publier.
  # ⚠ UN COMMIT VIDE NE DÉCLENCHE RIEN ICI : sans fichier modifié, paths-ignore
  #   ne laisse passer aucun chemin (vu le 26/09/2026 : 1577 est resté sur 1576).
  #   Relancer par workflow_dispatch, ou par un vrai changement hors des chemins ignorés.
  workflow_dispatch:

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      # L'HISTORIQUE SANS LES CONTENUS : scripts/sitemap.mjs (appelé par
      # fabriquer_site.mjs) date chaque page par son dernier commit.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # rc-core EST ASSEMBLE DE src/core/ (01/10/2026, src/core/LISEZMOI.md).
      # On le regenere, puis on exige que le fichier committe soit IDENTIQUE :
      # une modification faite dans un seul des deux (src/core/ sans
      # reassembler, ou rc-core a la main) echoue ici.
      - name: Assembler rc-core depuis src/core et comparer au fichier committe
        run: |
          node scripts/assembler_core.mjs --forcer
          if [ -n "$(git status --porcelain -- app/)" ]; then
            git status --short -- app/
            git diff --stat -- app/
            echo "::error::app/rc-core.<build>.js differe de l'assemblage de src/core/ : lancer node scripts/assembler_core.mjs et committer les deux."
            exit 1
          fi
          node scripts/assembler_core.mjs --verifier

      # UN SEUL ASSEMBLAGE POUR LES DEUX HOTES (05/10/2026) : la liste de ce qui
      # est mis en ligne vit dans scripts/fabriquer_site.mjs, que pages.yml
      # appelle aussi. Il ecarte les fichiers de travail (tests.js, sources,
      # notes) et MINIFIE rc-core et rc-style : le depot garde le code lisible,
      # seul le fichier servi change.
      - name: Assembler _site
        run: node scripts/fabriquer_site.mjs _site

      # GARDE-FOU. Un deploiement remplace TOUT le site : si l'assemblage a
      # rate, on prefere ne rien envoyer plutot que de vider sync.web.app.
      - name: Verifier avant d'envoyer
        run: |
          set -e
          test -f _site/index.html
          test -f _site/coachs.html
          test -f _site/app/index.html
          test -f _site/i/index.html
          test -f _site/maj/index.html
          test -f _site/p/index.html
          test -f _site/c/index.html
          test -f _site/a/index.html
          test -f _site/404.html
          test -f _site/aide-apk.html
          test -f _site/app/apk-version.json
          # L'APK : l'empreinte de sa cle doit etre publiee, sinon barre d'adresse.
          grep -q '"com.repcore.app"' _site/.well-known/assetlinks.json
          grep -q 'sha256_cert_fingerprints' _site/.well-known/assetlinks.json
          # AUCUN SERVICE WORKER A LA RACINE. Servi depuis /, il prend la
          # portee / : il intercepte la page de vente et survit a la
          # suppression du fichier. C'est arrive le 10/09/2026.
          test ! -f _site/sw.js
          # LA RACINE EST LA PAGE DE VENTE, PAS L'APP. Le meme jour,
          # index.html racine a ete remplace par l'application : la balise
          # canonical est ce qui les distingue a coup sur.
          grep -q 'rel="canonical"' _site/index.html
          # Le service worker de l'app, lui, doit bien etre la.
          test -f _site/app/sw.js
          # AUCUN FICHIER DE TRAVAIL, AUCUNE CARTE DE SOURCE (05/10/2026).
          test ! -f _site/app/tests.js
          test ! -e _site/scripts
          test ! -e _site/database.rules.json
          test -z "$(find _site -name '*.map' | head -1)"
          # Le code servi est bien le code minifie : plus un seul commentaire
          # de bloc en tete de fichier, et un poids qui a fondu.
          core=$(ls _site/app/rc-core.*.js)
          if [ "$(wc -c < "$core")" -gt 5500000 ]; then echo "rc-core n'est pas minifie"; exit 1; fi
          n=$(find _site -type f | wc -l)
          if [ "$n" -lt 400 ]; then
            echo "Seulement $n fichiers : assemblage suspect, on n'envoie rien."
            exit 1
          fi
          echo "Version du service worker :"
          head -1 _site/app/sw.js

      # LE CODE SE PARSE-T-IL ? C'est le plus bete et le plus grave : une
      # parenthese oubliee n'empeche pas la page de s'ouvrir, elle empeche TOUT
      # le JavaScript qui suit de tourner. L'app s'affiche, et plus rien ne
      # repond. Depuis que le code est servi a part, ce controle le lit aussi.
      - name: Verifier que le code se parse
        run: |
          set -e
          node scripts/verif/syntaxe.mjs
          # Et la version MINIFIEE, celle qui part.
          node scripts/verif/syntaxe.mjs _site/app/index.html

      # LE LINT (01/10/2026), BLOQUANT. Tous les scripts de la page partagent la
      # meme portee globale : une fonction appelee et jamais definie, ou deux
      # fonctions du meme nom dont la seconde ecrase la premiere, ne se voient
      # pas a la lecture et un try/catch les avale a l'execution. ESLint 9
      # (no-undef, no-redeclare, no-dupe-keys) sur la page concatenee, chaque
      # erreur ramenee a fichier:ligne. Voir scripts/verif/lint.mjs.
      - name: Lint
        run: node scripts/verif/lint.mjs

      # LES ACTIFS VERSIONNES. Depuis le build 1417, index.html ne porte plus le
      # code : il le DEMANDE, sous un nom qui contient le numero de build, et
      # l'hebergement sert ces deux fichiers immuables pour un an. Un nom qui ne
      # suit pas RC_BUILD, ou un actif absent, et la page s'ouvre sur un 404 :
      # ecran BLANC pour tout le monde, sans rien dans le diff pour le dire.
      - name: Verifier les actifs versionnes
        run: node scripts/verif/actifs.mjs

      # ET LA PURGE DU WORKER, SUR UN BANC. rc-core pese 5,5 Mo et le report
      # d'un cache a l'autre recopie tout : sans garde, chaque livraison en
      # EMPILE une de plus sur le telephone. Le banc seme trois caches, joue
      # activate, et verifie qu'il n'en reste que deux versions — plus la scene
      # inverse, ou un cache neuf inutilisable ne fait pas jeter l'ancien.
      - name: Verifier la purge des actifs par le worker
        run: node scripts/verif/worker-actifs.mjs

      # LA SUPPRESSION DISTANTE. cloudinaryDestroy detient l'API secret : un
      # identifiant Cloudinary est public, et sans controle d'appartenance
      # n'importe quel compte connecte effacerait les medias de n'importe qui.
      # Le banc fait TOURNER la fonction avec une fausse base et un faux reseau :
      # il verifie les dix refus, les deux autorisations, et que la signature
      # couvre exactement les parametres envoyes — une signature incomplete rend
      # 401 et fait echouer TOUTES les suppressions en silence.
      # ⚠ Il evalue functions/index.js avec de faux require : un require ajoute
      #   sans son faux fait echouer TOUT le deploiement (build 1601, 27/09/2026).
      - name: Verifier la suppression distante des medias
        run: node scripts/verif/suppression-distante.mjs

      # LES ILLUSTRATIONS. Un deploiement remplace TOUT le site : une image
      # annoncee par l'index mais absente du depot disparait de la production
      # sans que rien ne le dise. Le script refuse une fiche manquante, un
      # fichier illisible ou une dimension fausse dans l'index ; il se contente
      # de SIGNALER les vignettes absentes, pour lesquelles l'app a un repli.
      - name: Verifier les illustrations
        run: node scripts/verif/illustrations.mjs

      # LES REGLES DE LA BASE. coach_public se ferme sur une liste blanche, et
      # pushProfilCoach envoie le profil ENTIER : un champ ecrit par le code et
      # absent des regles fait rejeter TOUTE la branche, definitivement et sans
      # un mot. C'est arrive avec 'dispo', puis avec 'logo'.
      # Le script lit les deux fichiers SUR LE DISQUE — la sonde equivalente de
      # tests.js, elle, lit les regles par fetch, et database.rules.json n'est
      # pas deploye : elle rendait vert faute de pouvoir conclure.
      - name: Verifier les regles de la base
        run: node scripts/verif/regles.mjs

      # LES PRIX. tarifs.json est la seule source : l'app en porte une copie,
      # la page de vente et les CGV lient chaque montant a une de ses cles. Un
      # prix faux ou ecrit en dur arrete la livraison — la page annoncait
      # 9,95 EUR « sans engagement » pendant que PayPal encaissait 9,50 sur 12 mois.
      - name: Verifier les prix
        run: node scripts/verif/tarifs.mjs
      # LA FICHE PLAY STORE (02/10/2026) : longueurs, prix liés, images acceptées.
      - name: Fiche Play Store
        run: node scripts/verif/fiche-store.mjs

      # LA SYNCHRONISATION A DEUX APPAREILS. Le banc lit les fonctions de fusion
      # dans rc-core, rejoue 2000 entrelacements d'envois et de descentes sur
      # deux appareils et une fausse base, et exige qu'aucune seance, aucun
      # bilan, aucune pesee ne se perde. Il rougit si _doPushOne cesse de
      # fusionner avant d'ecrire. Moins de 5 s.
      - name: Verifier la synchronisation (banc a deux appareils)
        run: node scripts/verif/banc-sync.mjs

      # LA CONTENT-SECURITY-POLICY de /app (firebase.json) : presente, bornee
      # (ni *, ni https: en connect-src / img-src / media-src), object-src
      # 'none', et tout domaine que l'app appelle admis — sinon la fonction
      # casse en production, et seulement la.
      - name: Verifier la CSP de l'app
        run: node scripts/verif/csp.mjs

      # ── LA LIVRAISON ECHOUE SI UN TEST ECHOUE (lot 51, 02/10/2026) ──────────
      # Jusqu'ici la suite navigateur tournait dans un job a part, qui ne
      # retenait pas le deploiement : un test rouge laissait partir le site.
      # Les trois etapes ci-dessous sont AVANT « Deployer » : la moindre
      # assertion fausse (Worker, fonctions, app) et rien n'est envoye.
      - name: Tests du serveur léger
        working-directory: cloudflare
        run: node --test "test/*.test.mjs"

      # ⚠ Le motif, et non le dossier : `node --test functions/test/` prend le
      #   dossier pour un module sous Node 22 et echoue sans jouer un test.
      - name: Tests des fonctions
        run: node --test "functions/test/*.test.js"

      # La RACINE du depot est servie, et non app/ : la suite lit
      # ../database.rules.json. suite.mjs fixe lui-meme la fenetre (412x4000,
      # mobile) et sort en 1 au premier echec, sur une suite interrompue ou sur
      # moins de 1000 tests joues ; --tolere=N admet N echecs connus.
      - name: Suite intégrée
        env:
          SUITE_ATTENDUS: scripts/verif/echecs-attendus.json
        run: |
          set -e
          python3 -m http.server 8799 --bind 127.0.0.1 >/dev/null 2>&1 &
          google-chrome --headless=new --no-sandbox --disable-gpu --no-first-run \
            --user-data-dir="$RUNNER_TEMP/chrome" --remote-debugging-port=9223 about:blank >"$RUNNER_TEMP/chrome.log" 2>&1 &
          pret=non
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:9223/json/version >/dev/null; then pret=oui; break; fi
            sleep 1
          done
          if [ "$pret" != oui ]; then cat "$RUNNER_TEMP/chrome.log"; echo "::error::Chrome ne repond pas sur 9223."; exit 1; fi
          for i in $(seq 1 20); do curl -sf http://127.0.0.1:8799/app/index.html >/dev/null && break; sleep 0.5; done
          timeout 1800 node scripts/verif/suite.mjs "http://127.0.0.1:8799/app/index.html" 9223

      # LA FUMÉE DES PAGES (05/10/2026) : /, /app/ (sans compte et accueil de
      # l'athlète), /i/, /p/, /c/, /a/, /maj/, en 390×844 et 1280×800, à Paris et
      # à la Martinique. Rouge sur une exception, une ressource du site en
      # 4xx/5xx (hors exceptions documentées dans le script) ou un « undefined »,
      # « NaN », « Infinity », « [object Object] » visible. Le serveur et Chrome
      # de l'étape précédente servent encore ; relancés s'ils manquent.
      - name: Fumée des pages
        run: |
          curl -sf http://127.0.0.1:8799/index.html >/dev/null || { python3 -m http.server 8799 --bind 127.0.0.1 >/dev/null 2>&1 & sleep 2; }
          if ! curl -sf http://127.0.0.1:9223/json/version >/dev/null; then
            google-chrome --headless=new --no-sandbox --disable-gpu --no-first-run \
              --user-data-dir="$RUNNER_TEMP/chrome-fumee" --remote-debugging-port=9223 about:blank >/dev/null 2>&1 &
            for i in $(seq 1 30); do curl -sf http://127.0.0.1:9223/json/version >/dev/null && break; sleep 1; done
          fi
          timeout 900 node scripts/verif/fumee-pages.mjs "http://127.0.0.1:8799" 9223

      # LA BANNIÈRE D'INSTALLATION à six largeurs réelles (320 à 1024) : elle ne
      # descend jamais sur la barre d'onglets. Même Chrome que la suite.
      - name: Géométrie de la bannière
        run: timeout 300 node scripts/verif/banniere-geometrie.mjs "http://127.0.0.1:8799/app/index.html" 9223

      # LES RÈGLES SUR L'ÉMULATEUR (05/10/2026) : regles.mjs lit le fichier, ces
      # trois scripts écrivent pour de vrai contre la Realtime Database émulée
      # (projet demo-, aucun accès à la production, aucun secret). Ils lisent
      # EMU, http://127.0.0.1:9000 par défaut, le port de l'émulateur database.
      # firebase-tools exige Java 21 ; le Java du runner est plus ancien.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Règles (émulateur)
        run: |
          npm install -g firebase-tools
          firebase emulators:exec --only database --project demo-repcore \
            "node cloudflare/test/regles-amis.emu.mjs && node cloudflare/test/regles-evenements.emu.mjs && node cloudflare/test/regles-sante.emu.mjs"

      - name: Deployer
        env:
          CLE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -e
          if [ -z "$CLE" ]; then
            echo "Le secret FIREBASE_SERVICE_ACCOUNT est absent."
            echo "Depot > Settings > Secrets and variables > Actions"
            exit 1
          fi
          npm install -g firebase-tools
          printf '%s' "$CLE" > "$RUNNER_TEMP/cle.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/cle.json"
          # ⚠ L'HEBERGEMENT D'ABORD, ET SEUL A POUVOIR FAIRE TOMBER L'ETAPE.
          #   Mesure du 23/09/2026 : en ajoutant `database` a cette meme
          #   commande, la livraison a echoue en entier et le site est reste
          #   deux builds en arriere — sans que rien ne le dise ici. Le compte
          #   de service de GitHub n'a pas forcement le droit d'ecrire les
          #   regles ; l'hebergement, lui, doit partir quoi qu'il arrive.
          firebase deploy --only hosting --project repcore-sync --non-interactive
          # LES REGLES. Depuis le lot 0, le palier d'un athlete vit dans
          # droits/, dont la regle interdit toute ecriture cliente : sans ce
          # deploiement, le noeud n'existe pas et l'application retombe sur
          # l'ancien modele. On le tente, et on le DIT quand il echoue.
          if firebase deploy --only database --project repcore-sync --non-interactive; then
            echo "Regles deployees."
          else
            echo "::warning::REGLES NON DEPLOYEES. droits/ reste inaccessible et l application retombe sur l ancien modele : bash deploie.sh depuis un poste autorise."
          fi
          # LES FONCTIONS NE PARTENT PAS D'ICI (01/10/2026), et c'est décidé une
          # fois pour toutes : le serveur léger (Cloudflare Worker) fait leur
          # travail sur le plan Spark — paiements PayPal, droits/, push — et
          # les deux ensemble traiteraient chaque paiement deux fois
          # (firebase.json, « //pages » : « jamais avec »). Leur déploiement est
          # MANUEL : functions/README.md, « Déploiement manuel ». Le Worker, lui,
          # part par .github/workflows/cloudflare.yml.
          rm -f "$RUNNER_TEMP/cle.json"

  # L'ANCIEN JOB « suite-navigateur », NON BLOQUANT, EST RETIRE (lot 51) : la
  # suite joue desormais dans « deployer », avant « Deployer », et l'arrete.
  # LA SUITE NAVIGATEUR (app/tests.js, ~6 000 assertions) dans le Chrome du
  # runner. UN JOB A PART, qui ne retient PAS le deploiement : elle dure
  # plusieurs minutes, et le site ne doit pas attendre. Rouge, elle se voit
  # dans l'onglet Actions ; la corriger reste la priorite.
  # LA SUITE SUR LE FICHIER SERVI (05/10/2026, main) : le site met en ligne un
  # rc-core MINIFIE. La suite sur le depot bloque deja le deploiement (job
  # « deployer », lot 51) ; celle-ci, plus longue, juge le code minifie sans
  # retenir le site.
  suite-navigateur:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # LA MEME SUITE, SUR LE FICHIER SERVI (05/10/2026). Le site met en ligne un
      # rc-core MINIFIE : c'est lui que les utilisateurs executent, c'est donc
      # lui aussi qu'on juge. Le miroir garde tests.js et le texte d'origine des
      # fonctions (pour les assertions qui relisent le code), voir
      # scripts/miroir_minifie.mjs.
      - name: Suite navigateur sur le code minifie
        run: |
          set -e
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "::warning::Pas de Chrome sur ce runner : suite minifiee non jouee."
            exit 0
          fi
          node scripts/miroir_minifie.mjs "$RUNNER_TEMP/miroir"
          ( cd "$RUNNER_TEMP/miroir" && python3 -m http.server 8001 --bind 127.0.0.1 >/dev/null 2>&1 & )
          for i in $(seq 1 30); do curl -s http://127.0.0.1:8001/app/index.html >/dev/null && break; sleep 1; done
          VW=1280 VH=2000 timeout 1800 node scripts/verif/suite.mjs http://127.0.0.1:8001/app/index.html 9223
