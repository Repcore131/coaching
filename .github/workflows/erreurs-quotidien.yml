# ══════════════════════════════════════════════════════════════════════════
#  LES ERREURS DE LA VEILLE, PAR COURRIEL (série 6, lot 14)
# ══════════════════════════════════════════════════════════════════════════
#  Chaque matin : erreurs nouvelles ou en hausse (erreurs/, écrit par le
#  Worker, POST /erreur) et quota de la base au-delà de 70 / 90 %. Un
#  courriel seulement s'il y a quelque chose à dire. Lecture seule.
#  Secrets : FIREBASE_SERVICE_ACCOUNT, MAIL_MOT_DE_PASSE (+ MAIL_UTILISATEUR,
#  MAIL_DESTINATAIRE facultatifs), comme rapport-payeur.yml.
# ══════════════════════════════════════════════════════════════════════════
name: Erreurs de la veille

on:
  schedule:
    - cron: '53 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rapport:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Éprouver le script (fausse base)
        run: node --test scripts/verif/rapport_erreurs.test.mjs
      - name: Le rapport
        id: rapport
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set +e
          node scripts/rapport_erreurs.mjs
          S=$?
          [ $S -eq 0 ] && echo "envoyer=oui" >> "$GITHUB_OUTPUT"
          [ $S -eq 1 ] && exit 1
          exit 0
      - name: Le courriel
        if: steps.rapport.outputs.envoyer == 'oui'
        env:
          MAIL_UTILISATEUR: ${{ secrets.MAIL_UTILISATEUR || 'guellec.coachingpro@gmail.com' }}
          MAIL_MOT_DE_PASSE: ${{ secrets.MAIL_MOT_DE_PASSE }}
          MAIL_DESTINATAIRE: ${{ secrets.MAIL_DESTINATAIRE || 'guellec.coachingpro@gmail.com' }}
        run: |
          node scripts/envoyer_mail.mjs rapport-erreurs.md "RepCore : la santé de l'app"
