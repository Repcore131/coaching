# Fit Pulse : vérifications à chaque modification de club/ : syntaxe, analyse du
# code (ESLint), tests du moteur, règles d'accès sur le simulateur Firebase,
# parcours complet dans un vrai navigateur.
name: Fit Pulse - tests

on:
  pull_request:
    paths:
      - 'club/**'
      - '.github/workflows/fitpulse-tests.yml'
  push:
    branches: [main, 'claude/eloquent-lamport-0qxwdd']
    paths:
      - 'club/**'
      - '.github/workflows/fitpulse-tests.yml'
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Paris
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntaxe des scripts
        run: for f in club/*.js; do node --check "$f"; done
      - name: Tests du moteur
        run: node --test club/tests/*.test.mjs
      - name: Analyse du code (ESLint)
        working-directory: club
        run: npx -y eslint@9 .
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Règles d'accès sur le simulateur Firebase
        working-directory: club/tests/emul
        run: npx -y firebase-tools@13 emulators:exec --only database --project fitpulse-test "node ../regles.emul.mjs && node ../regles-orgs.emul.mjs && node ../migration.emul.mjs"
      - name: Parcours complet dans un navigateur
        run: |
          npm install --no-save --prefix "$RUNNER_TEMP/pw" playwright@1
          npx --prefix "$RUNNER_TEMP/pw" playwright install --with-deps chromium
          (cd club && python3 -m http.server 8765 >/dev/null 2>&1 &)
          sleep 2
          PW="$RUNNER_TEMP/pw/node_modules/playwright" node club/tests/e2e.mjs
      - name: Robot (toutes les pages, rôles, écrans, dates, base vide, chiffres)
        run: |
          curl -sf http://localhost:8765/ >/dev/null || { (cd club && python3 -m http.server 8765 >/dev/null 2>&1 &); sleep 2; }
          PW="$RUNNER_TEMP/pw/node_modules/playwright" node club/tests/robot.mjs
      - name: Multi-salles de bout en bout (simulateur base et authentification)
        working-directory: club/tests/emul
        run: |
          curl -sf http://localhost:8765/ >/dev/null || { (cd ../.. && python3 -m http.server 8765 >/dev/null 2>&1 &); sleep 2; }
          PW="$RUNNER_TEMP/pw/node_modules/playwright" npx -y firebase-tools@13 emulators:exec --only database,auth --project demo-fitpulse "node ../multi.emul.mjs"
