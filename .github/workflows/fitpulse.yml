# Mise en ligne de FIT PULSE sur sa propre adresse : https://<site>.web.app
#
# ⚠ SÉRIE 6 (lot 12, 08/10/2026) : Fit Pulse a SON projet Firebase (variable
# FITPULSE_PROJECT, secret FITPULSE_SERVICE_ACCOUNT, variable FITPULSE_DB_URL).
# Le compte de service et le projet de RepCore ne sont plus jamais utilisés
# ici : sans les trois, ou pointés sur repcore-sync, rien ne part.
#
# Le premier passage cree le site. Le nom doit etre libre dans tout Firebase :
# on essaie les noms de la liste dans l'ordre et on garde le premier obtenu.
name: Fit Pulse en ligne

on:
  push:
    branches: [main, 'claude/eloquent-lamport-0qxwdd']
    paths:
      - 'club/**'
      - '.github/workflows/fitpulse.yml'
  workflow_dispatch:

concurrency:
  group: fitpulse-hosting
  cancel-in-progress: true

jobs:
  deployer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Assembler le site
        run: |
          set -e
          cd club
          rm -rf _en_ligne && mkdir -p _en_ligne
          cp -a index.html pulse.css fonts.css fonts vendor manifest.webmanifest favicon.png icon-192.png icon-512.png icon-maskable-512.png apple-touch-icon.png robots.txt assets ./*.js _en_ligne/
          rm -f _en_ligne/assets/fitpulse-source.webp
          test -f _en_ligne/index.html && test -f _en_ligne/app.js

      # Code mis en ligne compressé et illisible (les mentions de copyright /*! */ restent).
      - name: Compresser le code
        run: |
          set -e
          cd club/_en_ligne
          for f in ./*.js; do npx -y terser@5 "$f" -c -m --comments '/^!/' -o "$f.min" && mv "$f.min" "$f"; done
          test -s app.js && grep -q 'Tous droits' core.js

      # Les regles d'acces (base partagee /pulse, cles de connexion, boite
      # d'envoi des invitations) AVANT la page qui s'en sert.
      - name: Le projet dédié est-il configuré ?
        id: projet
        env:
          PROJET: ${{ vars.FITPULSE_PROJECT }}
          BASE: ${{ vars.FITPULSE_DB_URL }}
          VU: ${{ secrets.FITPULSE_SERVICE_ACCOUNT != '' }}
        run: |
          if [ -n "$PROJET" ] && [ "$PROJET" != "repcore-sync" ] && [ -n "$BASE" ] && ! echo "$BASE" | grep -q repcore-sync && [ "$VU" = "true" ]; then
            echo "ok=oui" >> "$GITHUB_OUTPUT"
          else
            echo "ok=non" >> "$GITHUB_OUTPUT"
            echo "::warning::Projet Fit Pulse dédié non configuré (FITPULSE_PROJECT, FITPULSE_DB_URL, FITPULSE_SERVICE_ACCOUNT) : rien n'est déployé."
          fi

      - name: Regles d'acces Fit Pulse
        if: steps.projet.outputs.ok == 'oui'
        env:
          FITPULSE_SERVICE_ACCOUNT: ${{ secrets.FITPULSE_SERVICE_ACCOUNT }}
          FITPULSE_DB_URL: ${{ vars.FITPULSE_DB_URL }}
        run: node club/outils/fitpulse-serveur.mjs regles

      - name: Creer le site si besoin, puis deployer
        if: steps.projet.outputs.ok == 'oui'
        env:
          CLE: ${{ secrets.FITPULSE_SERVICE_ACCOUNT }}
          PROJET: ${{ vars.FITPULSE_PROJECT }}
        run: |
          set -e
          [ -n "$CLE" ] || { echo "Secret FITPULSE_SERVICE_ACCOUNT absent."; exit 1; }
          npm install -g firebase-tools >/dev/null 2>&1
          printf '%s' "$CLE" > "$RUNNER_TEMP/cle.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/cle.json"
          cd club
          SITE=""
          for N in fitpulse-niort fitpulse-fpniort fitpulse-fp-niort fitpulse-club-niort fitpulse-niort-79; do
            if firebase hosting:sites:get "$N" --project "$PROJET" --non-interactive >/dev/null 2>&1; then SITE="$N"; break; fi
            if firebase hosting:sites:create "$N" --project "$PROJET" --non-interactive; then SITE="$N"; break; fi
          done
          [ -n "$SITE" ] || { echo "::error::Aucun nom de site disponible."; exit 1; }
          # firebase.json de deploiement : le site Fit Pulse, et rien d'autre
          node -e "const c=require('./firebase.json'); c.hosting.site=process.argv[1]; delete c.database; require('fs').writeFileSync('firebase.json', JSON.stringify(c,null,2));" "$SITE"
          firebase deploy --only hosting --project "$PROJET" --non-interactive
          rm -f "$RUNNER_TEMP/cle.json"
          echo "### Fit Pulse est en ligne : https://$SITE.web.app" >> "$GITHUB_STEP_SUMMARY"
          echo "FITPULSE_URL=https://$SITE.web.app"
