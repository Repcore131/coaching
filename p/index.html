<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RepCore</title>
<!-- LA PAGE PUBLIQUE D'UN ATHLETE : /@<pseudo> (firebase.json), ou p/?u=<pseudo>.
     Autonome et legere : /profils_publics/<pseudo> et /volts_publics/<pseudo>
     (lecture publique), puis le rendu. Les balises og: entre les marqueurs
     sont l'apercu par defaut ; le Worker (cloudflare/src/pages.js) les remplace. -->
<!-- Un profil se partage, il ne se cherche pas (vie privée) : jamais indexé. -->
<meta name="robots" content="noindex">
<!--og:debut-->
<meta property="og:type" content="profile">
<meta property="og:site_name" content="RepCore">
<meta property="og:title" content="Rejoins-moi sur RepCore">
<meta property="og:description" content="Ma progression, séance après séance. Rejoins-moi sur RepCore.">
<meta property="og:image" content="https://repcore-sync.web.app/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<!--og:fin-->
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://repcore-sync-default-rtdb.firebaseio.com" crossorigin>
<link rel="stylesheet" href="/charte.css">
<style>
/* Charte commune : /charte.css. */
*{box-sizing:border-box}
html,body{margin:0;color:#fff;font-size:15px;line-height:1.5;overflow-x:hidden}
/* Le fond vit sur <html> seul : peint sur <body>, il cachait .aura (z-index:-1). */
body{background:transparent;min-height:100dvh}
/* L'AURA : deux halos rouges qui derivent derriere tout, et une grille fine. */
.aura{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;
  background:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px) 0 0/100% 32px,linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px) 0 0/32px 100%}
.aura:before,.aura:after{content:"";position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(60px);opacity:.45;
  background:radial-gradient(circle,#b30f0f 0,transparent 60%);animation:der 16s ease-in-out infinite alternate}
.aura:before{top:-35vmax;left:-25vmax}
.aura:after{bottom:-40vmax;right:-30vmax;opacity:.3;animation-duration:22s;animation-direction:alternate-reverse}
@keyframes der{to{transform:translate(12vmax,10vmax) scale(1.15)}}
main{max-width:480px;margin:0 auto;min-height:calc(100dvh - 44px);padding:22px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.tete{text-align:center;position:relative}
/* LA PHOTO dans un anneau qui tourne, l'embleme accroche en bas a droite. */
.av{position:relative;width:150px;height:150px;margin:0 auto 14px}
.av:before{content:"";position:absolute;inset:-5px;border-radius:50%;background:conic-gradient(from 0deg,#e02020,#ff8a5c,#5a0707,#e02020);animation:tour 3.5s linear infinite;
  box-shadow:0 0 40px rgba(224,32,32,.55)}
.av>img.ph{position:relative;width:150px;height:150px;border-radius:50%;object-fit:cover;border:4px solid var(--bg);display:block}
.av>img.pe{position:absolute;right:-18px;bottom:-12px;width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 0 14px rgba(224,32,32,.8));animation:flotte 3s ease-in-out infinite}
@keyframes tour{to{transform:rotate(360deg)}}
.emb{display:block;width:230px;height:230px;max-width:66vw;max-height:66vw;margin:0 auto 6px;object-fit:contain;
  filter:drop-shadow(0 0 28px rgba(224,32,32,.65));animation:flotte 3.6s ease-in-out infinite,lueur 3.6s ease-in-out infinite}
@keyframes flotte{50%{transform:translateY(-8px)}}
@keyframes lueur{50%{filter:drop-shadow(0 0 44px rgba(255,60,50,.9))}}
.pseudo{display:inline-block;color:var(--sub);font-size:13px;letter-spacing:.5px;border:1px solid var(--border);border-radius:var(--r-2);padding:3px 12px;background:rgba(0,0,0,.35)}
h1{font-size:54px;line-height:1;margin:12px 0 6px;letter-spacing:2px;
  background:linear-gradient(100deg,#fff 30%,#ffb3a8 45%,#fff 60%) 0 0/250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:brille 4s linear infinite}
@keyframes brille{to{background-position:-250% 0}}
.rang{display:inline-flex;gap:6px;align-items:center;color:#fff;font-weight:800;letter-spacing:3px;font-size:12px;text-transform:uppercase;
  background:linear-gradient(90deg,#8e0b0b,var(--red));border-radius:var(--r-2);padding:6px 14px;box-shadow:0 6px 24px rgba(224,32,32,.4)}
.depuis{color:var(--sub);font-size:13px;margin-top:10px}
.carte{background:color-mix(in srgb,var(--surface-1) 80%,transparent);border:1px solid var(--border);border-radius:var(--r-3);padding:16px;margin-top:14px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.jauge{height:10px;border-radius:5px;background:#262626;margin:10px 0 6px;overflow:hidden;position:relative}
.jauge i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,#c10b0b,#e32424 55%,#ff6a5c);box-shadow:0 0 14px rgba(255,70,60,.8);
  transition:width 1.6s cubic-bezier(.2,.8,.2,1) .3s;position:relative}
.jauge i:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent) 0 0/40% 100% no-repeat;animation:eclair 2.2s ease-in-out infinite}
@keyframes eclair{from{background-position:-60% 0}to{background-position:160% 0}}
.volts{display:flex;justify-content:space-between;color:var(--sub);font-size:13px}
.volts b{color:#fff;font-size:20px}
.grille{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:14px}
.grille div{background:color-mix(in srgb,var(--surface-1) 80%,transparent);border:1px solid var(--border);border-radius:var(--r-3);padding:14px 10px;text-align:center;position:relative;overflow:hidden}
.grille div:before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
.grille b{display:block;font-size:30px;line-height:1.05;font-weight:900;font-variant-numeric:tabular-nums}
.grille span{font-size:12px;color:var(--sub)}
.grille div:last-child:nth-child(odd){grid-column:1/-1}
.fun{text-align:center;color:#ffb3a8;font-size:13px;margin-top:10px}
h2{font-size:20px;letter-spacing:1.5px;color:var(--sub);margin:0 0 10px;display:flex;justify-content:space-between;align-items:baseline}
h2 em{font-style:normal;color:#fff;letter-spacing:1px}
.sem{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.sem i{aspect-ratio:1;border-radius:5px;background:#1f1f23;border:1px solid var(--border)}
.sem i.v{background:var(--red);border-color:var(--red-text);box-shadow:0 0 10px rgba(224,32,32,.6)}
.sem i.e{border:1px dashed #8a8a92;animation:pouls 1.6s ease-in-out infinite}
@keyframes pouls{50%{border-color:var(--red-text)}}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg figure{margin:0;text-align:center;font-size:11px;color:var(--sub);line-height:1.2}
.bdg img{display:block;width:100%;aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 4px 10px rgba(0,0,0,.6))}
.bdg .s{color:#ff6b6b}
.rec{padding:8px 0;border-bottom:1px solid var(--border);font-size:14px}
.rec:last-child{border:0}
.rec div{display:flex;justify-content:space-between;gap:10px}
.rec span{color:#fff;font-weight:800;white-space:nowrap}
.rec u{display:block;height:4px;border-radius:2px;margin-top:6px;background:linear-gradient(90deg,#8e0b0b,#ff4a3d);width:0;transition:width 1.2s ease .2s;text-decoration:none}
main .cta{margin:26px 0 10px;min-height:52px}
.sous{text-align:center;color:var(--sub);font-size:13px;margin-top:10px}
.acarte{display:flex;align-items:center;gap:14px;margin:18px auto 0;max-width:340px;padding:14px;border-radius:18px;background:#0e0e10;border:3px solid #4a4a50}
.acarte.elite{border-color:#ff3b3b}.acarte.legendaire{border-color:#ffcf5a}
.acarte .g{font-size:54px;font-weight:900;line-height:1;text-align:center;min-width:76px}
.acarte small{display:block;font-size:11px;letter-spacing:2px;color:#ff6b6b;margin-top:4px}
.acarte ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:14px}
.pied{text-align:center;margin-top:30px;font-size:12px;color:#6b6b72}
.pied a{color:#6b6b72}
.sq{background:linear-gradient(90deg,#161619,#1f1f23,#161619);background-size:200% 100%;animation:s 1.2s infinite;border-radius:10px}
@keyframes s{to{background-position:-200% 0}}
/* L'APPARITION : chaque bloc monte a son tour, une fois visible. */
.r{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1)}
.r.in{opacity:1;transform:none}
.pop>*{opacity:0;transform:scale(.4)}
.in.pop>*{animation:pop .5s cubic-bezier(.3,1.6,.5,1) forwards}
@keyframes pop{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,:before,:after{animation:none!important;transition:none!important}.r,.pop>*{opacity:1;transform:none}}
</style>
</head>
<body>
<div class="aura" aria-hidden="true"></div>
<a class="marque-bandeau" href="/" aria-label="RepCore, accueil"><img src="/app/img/vente/logo-72.webp" width="28" height="28" alt="">REPCORE</a>
<main id="m" aria-busy="true">
  <div class="sq" style="width:200px;height:200px;max-width:60vw;max-height:60vw;margin:0 auto 14px;border-radius:50%"></div>
  <div class="sq" style="height:38px;width:60%;margin:0 auto 10px"></div>
  <div class="sq" style="height:90px;margin-top:22px"></div>
</main>
<script>
(function(){
  var DB='https://repcore-sync-default-rtdb.firebaseio.com';
  // /@julie sur Firebase (reecriture) ; p/?u=julie ailleurs.
  var chemin=location.pathname, q=new URLSearchParams(location.search);
  var m=/\/@([^\/?#]+)/.exec(chemin);
  var pseudo=decodeURIComponent(m?m[1]:(q.get('u')||'')).toLowerCase();
  // Les chemins relatifs changent selon la forme : /@julie est a la racine,
  // p/ est un dossier.
  var racine=m?'/':'../';
  var z=document.getElementById('m');
  var calme=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function vide(t){z.removeAttribute('aria-busy');z.innerHTML='<div class="introuvable"><img src="/app/img/vente/logo-72.webp" width="64" height="64" alt="RepCore"><h1>Page introuvable</h1><p>'+esc(t)+'</p><a class="cta" href="'+racine+'i/">Découvrir RepCore</a></div>';}
  if(!/^[a-z0-9][a-z0-9._]{1,18}[a-z0-9]$/.test(pseudo)) return vide('Cette page n’existe pas.');
  var ctrl=window.AbortController?new AbortController():null;
  setTimeout(function(){ if(ctrl) ctrl.abort(); },6000);
  // Le point d'un pseudo est « __ » en base. Le rang du serveur prime (/volts_publics) : voir ficheAvecServeur (cloudflare/src/pages.js).
  function lire(n){ return fetch(DB+'/'+n+'/'+encodeURIComponent(pseudo.replace(/\./g,'__'))+'.json',ctrl?{signal:ctrl.signal}:{}).then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; }); }
  function vals(o){ return o?(Array.isArray(o)?o:Object.keys(o).map(function(k){return o[k];})):[]; }
  Promise.all([lire('profils_publics'),lire('volts_publics')]).then(function(l){
      var p=l[0], v=l[1], mq=vals(v&&v.masquer);
      if(p&&v&&p.rang&&v.rang){ p.rang=v.rang; p.volts={xp:+v.xp||0,de:+v.de||0,a:+v.a||0}; }
      if(p&&p.badges&&mq.length) p.badges=vals(p.badges).filter(function(b){ return b&&mq.indexOf(b.id)<0; });
      return p;
    })
    .then(function(p){
      if(!p||!p.prenom) return vide('Cette page n’existe pas, ou son titulaire l’a rendue privée.');
      var prenom=esc(p.prenom);
      document.title=p.prenom+' sur RepCore';
      var h='';
      // Ce que la page montre, et rien d'autre (liste blanche des regles) :
      // l'embleme et les volts, les 12 semaines, les chiffres d'entrainement,
      // les badges, les 3 meilleurs records et la photo si l'athlete les a
      // coches. JAMAIS de poids de corps, de mensuration ni de sante.
      function liste(o){ return o?Object.keys(o).map(function(k){return o[k];}):[]; }
      function nb(v){ return Number(v||0).toLocaleString('fr-FR'); }
      // Un chiffre qui compte jusqu'a sa valeur quand il devient visible.
      function cpt(v,d){ v=Number(v)||0; return '<b data-n="'+v+'" data-d="'+(d|0)+'">'+(calme?nb(v.toFixed(d|0)):'0')+'</b>'; }
      var emb=(p.rang&&p.rang.n)?racine+'app/img/rangs/rang_'+(p.rang.n|0)+'-512.webp':'';
      var ph=String(p.photo||'');
      if(!/^data:image\/(jpeg|webp|png);base64,[A-Za-z0-9+\/=]+$/.test(ph)&&!/^https:\/\/res\.cloudinary\.com\/[^\s"'<>]+$/.test(ph)) ph='';
      h+='<div class="tete r">';
      if(ph) h+='<div class="av"><img class="ph" src="'+esc(ph)+'" alt="'+prenom+'">'+(emb?'<img class="pe" src="'+emb+'" alt="">':'')+'</div>';
      else if(emb) h+='<img class="emb" src="'+emb+'" alt="Emblème '+esc(p.rang.nom||'')+'" width="230" height="230">';
      h+='<div class="pseudo">@'+esc(pseudo)+'</div><h1>'+prenom+'</h1>';
      if(p.rang&&p.rang.nom) h+='<div class="rang">⚡ '+esc(p.rang.nom)+'</div>';
      var st=p.chiffres||{};
      if(st.depuis>0){ try{ h+='<div class="depuis">Athlète RepCore depuis '+new Date(st.depuis).toLocaleDateString('fr-FR',{month:'long',year:'numeric'})+'</div>'; }catch(e){} }
      h+='</div>';
      var v=p.volts;
      if(v&&v.xp!=null){
        var part=v.a>v.de?Math.max(0,Math.min(1,(v.xp-v.de)/(v.a-v.de))):1;
        h+='<div class="carte r"><div class="volts"><span>⚡ '+cpt(v.xp)+' volts</span><span>'+(v.a>v.de?nb(v.a)+' pour le rang suivant':'rang maximal')+'</span></div>'
          +'<div class="jauge" role="progressbar" aria-label="Volts" aria-valuenow="'+Math.round(part*100)+'" aria-valuemin="0" aria-valuemax="100"><i data-w="'+Math.round(part*100)+'%"></i></div></div>';
      }
      var ca=p.carte;
      if(ca&&ca.g){
        var cad={standard:'STANDARD',elite:'ÉLITE',legendaire:'LÉGENDAIRE'}[ca.c]||'STANDARD';
        h+='<div class="acarte '+(/^(elite|legendaire)$/.test(ca.c)?ca.c:'')+'" aria-label="Carte d’athlète, note '+(ca.g|0)+'"><div class="g">'+(ca.g|0)+'<small>'+cad+'</small></div><ul>'
          +['FOR','VOL','REG','PRO','END'].map(function(k){return '<li><b>'+(ca[k]|0)+'</b> '+k+'</li>';}).join('')+'</ul></div>';
      }
      var ch='';
      if(p.seances!=null) ch+='<div>'+cpt(p.seances|0)+'<span>séances</span></div>';
      if(p.serie!=null) ch+='<div>'+cpt(p.serie|0)+'<span>semaines d’affilée</span></div>';
      var t=Number(st.tonnage)||0;
      if(t>0) ch+=t>=1000?'<div>'+cpt(t/1000,1)+'<span>tonnes soulevées</span></div>':'<div>'+cpt(t)+'<span>kg soulevés</span></div>';
      if(st.series>0) ch+='<div>'+cpt(st.series)+'<span>séries</span></div>';
      if(st.exos>0) ch+='<div>'+cpt(st.exos)+'<span>exercices différents</span></div>';
      if(ch) h+='<div class="grille r pop">'+ch+'</div>';
      // L'EQUIVALENT : un bus fait 12 t, une voiture 1,2 t.
      if(t>=12000) h+='<div class="fun r">🚌 Soit '+nb(Math.round(t/1200)/10)+' bus soulevés</div>';
      else if(t>=1200) h+='<div class="fun r">🚗 Soit '+nb(Math.round(t/120)/10)+' voitures soulevées</div>';
      if(/^[01]{11}[01e]$/.test(p.semaines||'')) h+='<div class="carte r"><h2>12 dernières semaines<em>'+p.semaines.replace(/[^1]/g,'').length+'/12</em></h2><div class="sem pop r" aria-label="'+p.semaines.replace(/[^1]/g,'').length+' semaines validées sur 12">'
        +p.semaines.split('').map(function(c){return '<i class="'+(c==='1'?'v':(c==='e'?'e':''))+'"></i>';}).join('')+'</div></div>';
      var b=liste(p.badges);
      var img=function(x){ return /^img\/badges\/[a-z0-9_-]+\.(webp|png)$/.test(x||'')?racine+'app/'+x:''; };
      if(b.length) h+='<div class="carte r"><h2>Badges<em>'+b.length+'</em></h2><div class="bdg pop r">'+b.map(function(x){
        var a=img(x.img)||img(x.repli), r=img(x.repli);
        return '<figure>'+(a?'<img src="'+a+'" alt="" loading="lazy"'+(r&&r!==a?' onerror="this.onerror=null;this.src=\''+r+'\'"':'')+'>':'')
          +'<figcaption'+(x.secret?' class="s"':'')+'>'+esc(x.nom)+(x.secret?' · secret':'')+'</figcaption></figure>';}).join('')+'</div></div>';
      var rc=liste(p.meilleurs), max=0;
      rc.forEach(function(x){ max=Math.max(max,Number(x.kg)||0); });
      if(rc.length) h+='<div class="carte r"><h2>Meilleurs records</h2>'+rc.map(function(x){
        return '<div class="rec"><div><b>'+esc(x.exo)+'</b><span>'+nb(x.kg)+' kg</span></div><u data-w="'+Math.round((Number(x.kg)||0)/(max||1)*100)+'%"></u></div>';}).join('')+'</div>';
      // LE CODE PARRAIN : celui du lien suivi s'il y en a un, sinon celui du profil.
      var ref=(q.get('ref')||p.ref||'').toUpperCase();
      var src=(q.get('src')||'page').replace(/[^a-z0-9_-]/gi,'').slice(0,20);
      var duel=(q.get('duel')||'').toLowerCase();
      var cible=racine+'i/?'+(/^[A-Z]{4,6}[A-Z2-9]{3}$/.test(ref)?'ref='+ref+'&':'')+'src='+src+(/^d[a-z0-9]{10,24}$/.test(duel)?'&duel='+duel:'');
      h+='<a class="cta r" href="'+cible+'">Rejoins '+prenom+' sur RepCore</a>';
      if(/^[A-Z]{4,6}[A-Z2-9]{3}$/.test(ref)) h+='<div class="sous">Grâce à '+prenom+', ton premier mois est offert.</div>';
      h+='<button type="button" class="cta-sec part r" id="part">Partager cette page</button>';
      h+='<div class="pied"><a href="'+racine+'?src=profil">RepCore</a> · l’app d’entraînement qui te suit séance après séance.</div>';
      z.removeAttribute('aria-busy'); z.innerHTML=h;
      document.getElementById('part').onclick=function(){
        var u=location.origin+location.pathname+location.search, bt=this;
        if(navigator.share) navigator.share({title:p.prenom+' sur RepCore',url:u}).catch(function(){});
        else if(navigator.clipboard) navigator.clipboard.writeText(u).then(function(){ bt.textContent='Lien copié ✓'; });
      };
      anime();
    })
    .catch(function(){ vide('Page injoignable pour l’instant. Réessaie dans un moment.'); });
  // L'ANIMATION : les blocs apparaissent quand ils entrent a l'ecran ; les
  // chiffres comptent, la jauge et les barres se remplissent.
  function allume(el){
    if(el.classList.contains('in')) return;
    el.classList.add('in');
    [].forEach.call(el.querySelectorAll('[data-w]'),function(x){ x.style.width=x.getAttribute('data-w'); });
    if(el.classList.contains('pop')) [].forEach.call(el.children,function(c,i){ c.style.animationDelay=(i*70)+'ms'; });
    [].forEach.call(el.querySelectorAll('b[data-n]'),function(x){
      var n=Number(x.getAttribute('data-n'))||0, d=Number(x.getAttribute('data-d'))||0, t0=null;
      if(calme) return;
      function pas(t){ if(t0==null) t0=t; var k=Math.min(1,(t-t0)/1300), e=1-Math.pow(1-k,3);
        x.textContent=Number((n*e).toFixed(d)).toLocaleString('fr-FR',{minimumFractionDigits:d,maximumFractionDigits:d});
        if(k<1) requestAnimationFrame(pas); }
      requestAnimationFrame(pas);
    });
  }
  function anime(){
    var els=document.querySelectorAll('.r');
    if(calme||!window.IntersectionObserver){ [].forEach.call(els,allume); return; }
    var io=new IntersectionObserver(function(l){ l.forEach(function(e){ if(e.isIntersecting){ allume(e.target); io.unobserve(e.target); } }); },{threshold:.15});
    [].forEach.call(els,function(e){ io.observe(e); });
  }
})();
</script>
<script>
// L'ARRIVEE (attribution) : src, amb, ref=1 (jamais le code). Une fois par jour
// et par lien (localStorage) ; ni cookie, ni IP, ni identifiant.
(function(){try{var p=new URLSearchParams(location.search);
var src=(p.get('src')||'page').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,20);
var amb=(p.get('amb')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,16);
var ref=p.get('ref')?1:0;
var k='rc_attr_'+new Date().toISOString().slice(0,10)+'_'+(src||'-')+'_'+(amb||'-');
if(localStorage.getItem(k)) return; localStorage.setItem(k,'1');
fetch('https://repcore-serveur.repcore.workers.dev/arrivee?src='+encodeURIComponent(src)+(amb?'&amb='+amb:'')+(ref?'&ref=1':''),{mode:'no-cors',keepalive:true}).catch(function(){});
}catch(e){}})();
</script>
</body>
</html>
