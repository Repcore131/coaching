<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RepCore</title>
<!-- LA PAGE PUBLIQUE D'UN ATHLETE : /@<pseudo> (reecriture firebase.json), ou
     p/?u=<pseudo> la ou il n'y a pas de reecriture (GitHub Pages).
     AUTONOME ET LEGERE, C'EST TOUT SON CAHIER DES CHARGES : ni l'app, ni une
     police, ni une bibliotheque — une requete a /profils_publics/<pseudo>
     (lecture publique, champs publics seulement : database.rules.json), et le
     rendu. Moins d'une seconde sur un telephone en 4G.
     Les balises og: entre les deux marqueurs sont l'apercu PAR DEFAUT ; le
     Worker (cloudflare/src/pages.js, vers qui firebase.json redirige /@*) les
     remplace par celles de l'athlete : prenom, rang, emblème. -->
<!--og:debut-->
<meta property="og:type" content="profile">
<meta property="og:site_name" content="RepCore">
<meta property="og:title" content="Rejoins-moi sur RepCore">
<meta property="og:description" content="Ma progression, séance après séance. Rejoins-moi sur RepCore.">
<meta property="og:image" content="https://repcore-sync.web.app/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<!--og:fin-->
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://repcore-sync-default-rtdb.firebaseio.com" crossorigin>
<style>
:root{--rouge:#E02020;--fond:#0b0b0c;--carte:#151518;--bord:#2a2a2e;--gris:#a1a1aa}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:#fff;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:480px;margin:0 auto;padding:28px 18px calc(28px + env(safe-area-inset-bottom,0px))}
.emb{display:block;width:240px;height:240px;max-width:70vw;max-height:70vw;margin:0 auto 6px;object-fit:contain;filter:drop-shadow(0 0 28px rgba(224,32,32,.6))}
.jauge{height:8px;border-radius:4px;background:#262626;margin:12px 0 4px;overflow:hidden}
.jauge i{display:block;height:100%;background:linear-gradient(90deg,#c10b0b,#e32424 55%,#ff6a5c)}
.volts{text-align:center;color:var(--gris);font-size:13px}
.sem{display:grid;grid-template-columns:repeat(12,1fr);gap:5px}
.sem i{aspect-ratio:1;border-radius:4px;background:#1f1f23;border:1px solid var(--bord)}
.sem i.v{background:var(--rouge);border-color:var(--rouge);box-shadow:0 0 8px rgba(224,32,32,.5)}
.sem i.e{border:1px dashed #6b6b72}
.bdg{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg figure{margin:0;text-align:center;font-size:11px;color:var(--gris);line-height:1.2}
.bdg img{display:block;width:100%;aspect-ratio:1;object-fit:contain}
.bdg .s{color:#ff6b6b}
.carte{display:flex;align-items:center;gap:14px;margin:18px auto 0;max-width:340px;padding:14px;border-radius:18px;background:linear-gradient(160deg,#151517,#050505);border:3px solid #4a4a50}
.carte.elite{border-color:#ff3b3b;box-shadow:0 0 18px rgba(255,59,59,.45)}
.carte.legendaire{border-color:#ffcf5a;box-shadow:0 0 22px rgba(255,190,70,.5)}
.carte .g{font-size:54px;font-weight:900;line-height:1;text-align:center;min-width:76px}
.carte .g small{display:block;font-size:11px;letter-spacing:2px;color:#ff6b6b;margin-top:4px}
.carte.legendaire .g small{color:#ffcf5a}
.carte ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;font-size:14px}
.carte li b{display:inline-block;min-width:26px}
.pseudo{text-align:center;color:var(--gris);font-size:14px;letter-spacing:.5px}
h1{text-align:center;font-size:34px;line-height:1.1;margin:4px 0 2px;letter-spacing:.5px}
.rang{text-align:center;color:#ff3b3b;font-weight:800;letter-spacing:3px;font-size:13px;text-transform:uppercase}
.chiffres{display:flex;gap:10px;margin:22px 0 8px}
.chiffres div{flex:1;background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:12px 8px;text-align:center}
.chiffres b{display:block;font-size:28px;line-height:1}
.chiffres span{font-size:12px;color:var(--gris)}
h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gris);margin:22px 0 8px}
.puces{display:flex;flex-wrap:wrap;gap:6px}
.puces span{background:#240707;border:1px solid #4a0c0c;border-radius:6px;padding:5px 11px;font-size:13px;font-weight:700}
.rec{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--bord);font-size:14px}
.rec span{color:var(--gris);white-space:nowrap}
.cta{display:block;margin:28px 0 10px;background:var(--rouge);color:#fff;text-align:center;text-decoration:none;font-weight:800;
  letter-spacing:.5px;padding:17px 14px;border-radius:14px;font-size:17px;box-shadow:0 10px 30px rgba(224,32,32,.35)}
.sous{text-align:center;color:var(--gris);font-size:13px}
.pied{text-align:center;margin-top:30px;font-size:12px;color:#6b6b72}
.pied a{color:#6b6b72}
.vide{text-align:center;padding:60px 10px;color:var(--gris)}
.sq{background:linear-gradient(90deg,#161619,#1f1f23,#161619);background-size:200% 100%;animation:s 1.2s infinite;border-radius:10px}
@keyframes s{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sq{animation:none}}
</style>
</head>
<body>
<main id="m" aria-busy="true">
  <div class="sq" style="width:240px;height:240px;max-width:70vw;max-height:70vw;margin:0 auto 14px;border-radius:50%"></div>
  <div class="sq" style="height:34px;width:60%;margin:0 auto 10px"></div>
  <div class="sq" style="height:70px;margin-top:22px"></div>
</main>
<script>
(function(){
  var DB='https://repcore-sync-default-rtdb.firebaseio.com';
  // /@julie sur Firebase (reecriture) ; p/?u=julie ailleurs.
  var chemin=location.pathname, q=new URLSearchParams(location.search);
  var m=/\/@([^\/?#]+)/.exec(chemin);
  var pseudo=decodeURIComponent(m?m[1]:(q.get('u')||'')).toLowerCase();
  // Les chemins relatifs changent selon la forme : /@julie est a la racine,
  // p/ est un dossier.
  var racine=m?'/':'../';
  var z=document.getElementById('m');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function vide(t){z.removeAttribute('aria-busy');z.innerHTML='<div class="vide"><p>'+esc(t)+'</p><a class="cta" href="'+racine+'i/">Découvrir RepCore</a></div>';}
  if(!/^[a-z0-9][a-z0-9._]{1,18}[a-z0-9]$/.test(pseudo)) return vide('Cette page n’existe pas.');
  var ctrl=window.AbortController?new AbortController():null;
  setTimeout(function(){ if(ctrl) ctrl.abort(); },6000);
  fetch(DB+'/profils_publics/'+encodeURIComponent(pseudo)+'.json',ctrl?{signal:ctrl.signal}:{})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(p){
      if(!p||!p.prenom) return vide('Cette page n’existe pas, ou son titulaire l’a rendue privée.');
      var prenom=esc(p.prenom);
      document.title=p.prenom+' sur RepCore';
      var h='';
      // Ce que la page montre : l'emblème et la jauge de volts, les 12 dernières
      // semaines, les badges en images, les 3 meilleurs records (si l'athlète
      // l'a choisi), les séances. JAMAIS de poids de corps, de photo ni de santé.
      function liste(o){ return o?Object.keys(o).map(function(k){return o[k];}):[]; }
      function nb(v){ return Number(v||0).toLocaleString('fr-FR'); }
      if(p.rang&&p.rang.n) h+='<img class="emb" src="'+racine+'app/img/rangs/rang_'+(p.rang.n|0)+'-512.webp" alt="Emblème '+esc(p.rang.nom||'')+'" width="240" height="240">';
      h+='<div class="pseudo">@'+esc(pseudo)+'</div><h1>'+prenom+'</h1>';
      if(p.rang&&p.rang.nom) h+='<div class="rang">'+esc(p.rang.nom)+'</div>';
      var v=p.volts;
      if(v&&v.xp!=null){
        var part=v.a>v.de?Math.max(0,Math.min(1,(v.xp-v.de)/(v.a-v.de))):1;
        h+='<div class="jauge" role="progressbar" aria-label="Volts" aria-valuenow="'+Math.round(part*100)+'" aria-valuemin="0" aria-valuemax="100"><i style="width:'+Math.round(part*100)+'%"></i></div>'
          +'<div class="volts">⚡ '+nb(v.xp)+' V'+(v.a>v.de?' · '+nb(v.a)+' V pour le rang suivant':' · rang maximal')+'</div>';
      }
      var ca=p.carte;
      if(ca&&ca.g){
        var cad={standard:'STANDARD',elite:'ÉLITE',legendaire:'LÉGENDAIRE'}[ca.c]||'STANDARD';
        h+='<div class="carte '+(/^(elite|legendaire)$/.test(ca.c)?ca.c:'')+'" aria-label="Carte d’athlète, note '+(ca.g|0)+'"><div class="g">'+(ca.g|0)+'<small>'+cad+'</small></div><ul>'
          +['FOR','VOL','REG','PRO','END'].map(function(k){return '<li><b>'+(ca[k]|0)+'</b> '+k+'</li>';}).join('')+'</ul></div>';
      }
      var ch='';
      if(p.seances!=null) ch+='<div><b>'+nb(p.seances|0)+'</b><span>séances</span></div>';
      if(p.serie!=null) ch+='<div><b>'+(p.serie|0)+'</b><span>semaines d’affilée</span></div>';
      if(ch) h+='<div class="chiffres">'+ch+'</div>';
      if(/^[01]{11}[01e]$/.test(p.semaines||'')) h+='<h2>12 dernières semaines</h2><div class="sem" aria-label="'+p.semaines.replace(/[^1]/g,'').length+' semaines validées sur 12">'
        +p.semaines.split('').map(function(c){return '<i class="'+(c==='1'?'v':(c==='e'?'e':''))+'"></i>';}).join('')+'</div>';
      var b=liste(p.badges);
      var img=function(x){ return /^img\/badges\/[a-z0-9_-]+\.(webp|png)$/.test(x||'')?racine+'app/'+x:''; };
      if(b.length) h+='<h2>Badges</h2><div class="bdg">'+b.map(function(x){
        var a=img(x.img)||img(x.repli), r=img(x.repli);
        return '<figure>'+(a?'<img src="'+a+'" alt="" loading="lazy"'+(r&&r!==a?' onerror="this.onerror=null;this.src=\''+r+'\'"':'')+'>':'')
          +'<figcaption'+(x.secret?' class="s"':'')+'>'+esc(x.nom)+(x.secret?' · secret':'')+'</figcaption></figure>';}).join('')+'</div>';
      var r=liste(p.meilleurs);
      if(r.length) h+='<h2>Meilleurs records</h2>'+r.map(function(x){
        return '<div class="rec"><b>'+esc(x.exo)+'</b><span>'+nb(x.kg)+' kg</span></div>';}).join('');
      // LE CODE PARRAIN : celui du lien suivi s'il y en a un, sinon celui du profil.
      var ref=(q.get('ref')||p.ref||'').toUpperCase();
      var src=(q.get('src')||'page').replace(/[^a-z0-9_-]/gi,'').slice(0,20);
      var duel=(q.get('duel')||'').toLowerCase();
      var cible=racine+'i/?'+(/^[A-Z]{4,6}[A-Z2-9]{3}$/.test(ref)?'ref='+ref+'&':'')+'src='+src+(/^d[a-z0-9]{10,24}$/.test(duel)?'&duel='+duel:'');
      h+='<a class="cta" href="'+cible+'">Rejoins '+prenom+' sur RepCore</a>';
      if(/^[A-Z]{4,6}[A-Z2-9]{3}$/.test(ref)) h+='<div class="sous">Avec son code, tu as 2 mois pour essayer au lieu d’un.</div>';
      h+='<div class="pied"><a href="'+racine+'">RepCore</a> · l’app d’entraînement qui te suit séance après séance.</div>';
      z.removeAttribute('aria-busy'); z.innerHTML=h;
    })
    .catch(function(){ vide('Page injoignable pour l’instant. Réessaie dans un moment.'); });
})();
</script>
<script>
// L'ARRIVEE (attribution) : src, amb, et le SEUL fait qu'un code parrain etait
// la (ref=1, jamais le code : il designe une personne). Une fois par jour et
// par lien sur cet appareil (localStorage, premiere partie) ; ni cookie, ni
// IP, ni identifiant. La fonction attribArrivee ne repond rien : absente
// (plan Spark), rien ne casse.
(function(){try{var p=new URLSearchParams(location.search);
var src=(p.get('src')||'page').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,20);
var amb=(p.get('amb')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,16);
var ref=p.get('ref')?1:0;
var k='rc_attr_'+new Date().toISOString().slice(0,10)+'_'+(src||'-')+'_'+(amb||'-');
if(localStorage.getItem(k)) return; localStorage.setItem(k,'1');
fetch('https://repcore-serveur.repcore.workers.dev/arrivee?src='+encodeURIComponent(src)+(amb?'&amb='+amb:'')+(ref?'&ref=1':''),{mode:'no-cors',keepalive:true}).catch(function(){});
}catch(e){}})();
</script>
</body>
</html>
