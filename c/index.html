<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>RepCore</title>
<!-- LA VITRINE PUBLIQUE D'UN COACH : /coach/<slug> (reecriture firebase.json),
     ou c/?s=<slug> la ou il n'y a pas de reecriture.
     Meme cahier des charges que p/ : autonome, une requete a /vitrines/<slug>
     (lecture publique, liste blanche de champs — database.rules.json), moins
     d'une seconde. Ce noeud est PUBLIE par l'app du coach a chaque
     enregistrement de son profil (publierVitrinePublique), depuis ce que
     s-vitrine montre deja a ses athletes — sans ses coordonnees, sans ses
     messages, sans ses images en base64 (trop lourdes pour une page web).
     Les balises og: entre les marqueurs : l'apercu par defaut, remplace par
     la fonction pagePublique quand elle sert ces pages (plan Blaze). -->
<!--og:debut-->
<meta property="og:type" content="profile">
<meta property="og:site_name" content="RepCore">
<meta property="og:title" content="Mon coaching sur RepCore">
<meta property="og:description" content="Programmes, suivi, séances : commence avec moi sur RepCore.">
<meta property="og:image" content="https://repcore-sync.web.app/og-image.png">
<meta name="twitter:card" content="summary_large_image">
<!--og:fin-->
<meta name="theme-color" content="#0b0b0c">
<link rel="preconnect" href="https://repcore-sync-default-rtdb.firebaseio.com" crossorigin>
<link rel="stylesheet" href="/charte.css">
<style>
/* LA CHARTE (/charte.css, 01/10/2026) : polices, jetons, .cta, titres, bandeau
   et etat vide. Ici, ce qui est propre a cette page. */
*{box-sizing:border-box}
html,body{margin:0;color:#fff;font-size:15px;line-height:1.55}
main{max-width:520px;margin:0 auto;padding:22px 18px calc(28px + env(safe-area-inset-bottom,0px))}
.photo{display:block;width:128px;height:128px;border-radius:50%;object-fit:cover;margin:0 auto 12px;border:3px solid #3a0000;
  box-shadow:0 0 0 4px rgba(224,32,32,.25),0 12px 30px rgba(0,0,0,.5);background:#1b1b1e}
h1{text-align:center;font-size:46px;line-height:1;margin:0 0 6px}
.equipe{text-align:center;color:var(--red-text);font-weight:800;letter-spacing:2.5px;font-size:12px;text-transform:uppercase}
.phrase{text-align:center;color:#d4d4d8;margin:10px 0 0}
.puces{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.puces span{background:#240707;border:1px solid #4a0c0c;border-radius:var(--r-1);padding:5px 11px;font-size:13px;font-weight:700}
h2{font-size:22px;letter-spacing:1.5px;color:var(--sub);margin:24px 0 8px}
.txt{white-space:pre-line;color:#d4d4d8}
.prog{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-3);overflow:hidden;margin-bottom:10px}
.prog img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:#1b1b1e}
.prog div{padding:12px 14px}
.prog b{display:block;font-size:16px}
.prog p{margin:4px 0 8px;color:var(--sub);font-size:14px}
.prog .ligne{display:flex;justify-content:space-between;align-items:center;gap:10px}
.prog .prix{font-weight:800}
.prog a{color:#fff;background:#2a0707;border:1px solid #5a0a0a;border-radius:var(--r-2);padding:8px 12px;text-decoration:none;font-weight:700;font-size:13px}
/* Le bouton principal est celui de la charte (.cta). */
main .cta{margin:28px 0 10px;min-height:52px}
.pied{text-align:center;margin-top:30px;font-size:12px;color:#6b6b72}
.pied a{color:#6b6b72}
/* L'etat vide : .introuvable, dans la charte. */
/* LOT C6 : les formules du coach, lues dans tarifs.json, et « Ça m'intéresse ». */
.frm{background:var(--surface-1);border:1px solid var(--border);border-radius:var(--r-3);padding:14px;margin-bottom:10px}
.frm b{display:block;font-size:16px}
.frm p{margin:4px 0 10px;color:#d4d4d8;font-size:14px}
.frm .ligne{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.frm .prix{font-weight:800;font-size:17px}
.frm .duree{color:var(--sub);font-size:13px;font-weight:600}
.frm button,.frm .env{color:#fff;background:#2a0707;border:1px solid #5a0a0a;border-radius:var(--r-2);padding:10px 14px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;min-height:44px}
.frm form{display:none;margin-top:12px;gap:8px;flex-direction:column}
.frm.ouvert form{display:flex}
.frm.ouvert .interesse{display:none}
.frm input{width:100%;min-height:46px;padding:10px 12px;border-radius:var(--r-2);border:1px solid var(--border);background:#0f0f11;color:#fff;font:inherit;font-size:16px}
.frm .piege{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.frm .note{color:var(--sub);font-size:12px;line-height:1.5;margin:0}
.frm .err{color:#ff8a8a;font-size:13px;margin:0;min-height:0}
.frm .env{background:var(--red);border-color:var(--red)}
.frm .gestes{display:flex;gap:8px;flex-wrap:wrap}
.frm .payer{color:#fff;background:var(--red);border:1px solid var(--red);border-radius:var(--r-2);padding:10px 14px;font-weight:800;font-size:14px;text-decoration:none;min-height:44px;display:inline-flex;align-items:center}
.frm.ouvert .gestes{display:none}
.merci{background:#140606;border:1px solid #4a0c0c;border-radius:var(--r-3);padding:14px;margin-top:12px;white-space:pre-line;color:#fff}
.merci small{display:block;color:var(--sub);margin-top:8px}
.sq{background:linear-gradient(90deg,#161619,#1f1f23,#161619);background-size:200% 100%;animation:s 1.2s infinite;border-radius:10px}
@keyframes s{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sq{animation:none}}
</style>
</head>
<body>
<a class="marque-bandeau" href="/" aria-label="RepCore, accueil"><img src="/app/img/vente/logo-72.webp" width="28" height="28" alt="">REPCORE</a>
<main id="m" aria-busy="true">
  <div class="sq" style="width:128px;height:128px;margin:0 auto 14px;border-radius:50%"></div>
  <div class="sq" style="height:30px;width:60%;margin:0 auto 10px"></div>
  <div class="sq" style="height:120px;margin-top:22px"></div>
</main>
<script>
(function(){
  var DB='https://repcore-sync-default-rtdb.firebaseio.com';
  var chemin=location.pathname, q=new URLSearchParams(location.search);
  var m=/\/coach\/([^\/?#]+)/.exec(chemin);
  var slug=decodeURIComponent(m?m[1]:(q.get('s')||'')).toLowerCase();
  var racine=m?'/':'../';
  var z=document.getElementById('m');
  function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function https(u){ u=String(u||''); return /^https:\/\//.test(u)?esc(u):''; }
  var SERVEUR='https://repcore-serveur.repcore.workers.dev';
  function euros(n){ var x=Number(n)||0; var s=(Math.round(x*100)%100===0)?String(Math.round(x)):x.toFixed(2).replace('.',','); return s+'\u00a0'+String.fromCharCode(8364); }
  function duree(k,f){
    if(k==='revision_prog') return 'à la demande';
    if(k==='programme_perso') return 'une fois, '+f.mois+' mois d’app inclus';
    return f.mois+' mois de suivi';
  }
  var MSG={prenom:'Écris ton prénom.',contact:'Laisse un téléphone ou un e-mail valable.',formule:'Cette formule n’est plus proposée.',
    plafond:'Beaucoup de demandes aujourd’hui : réessaie demain.',trop:'Trop d’essais d’un coup : réessaie dans une minute.',page:'Cette page n’est plus en ligne.'};
  function brancherFormules(v,prenom){
    var accueil=String(v.accueil||'Merci {prénom} ! J’ai bien reçu ta demande. Je te réponds sous 48 h, par le moyen que tu m’as laissé, pour qu’on fixe un premier échange.');
    [].forEach.call(z.querySelectorAll('.frm'),function(c){
      c.querySelector('.interesse').addEventListener('click',function(){ c.classList.add('ouvert'); var i=c.querySelector('input'); if(i) i.focus(); });
      var f=c.querySelector('form');
      f.addEventListener('submit',function(e){
        e.preventDefault();
        var err=f.querySelector('.err'), bt=f.querySelector('.env');
        var d={slug:slug,formule:c.getAttribute('data-f'),prenom:f.prenom.value,contact:f.contact.value,site:f.site.value};
        if(!String(d.prenom).trim()){ err.textContent=MSG.prenom; return; }
        if(!String(d.contact).trim()){ err.textContent=MSG.contact; return; }
        bt.disabled=true; bt.textContent='Envoi…'; err.textContent='';
        fetch(SERVEUR+'/prospect',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
          .then(function(r){ return r.json().catch(function(){ return {ok:false}; }); })
          .then(function(r){
            if(!r||!r.ok){ err.textContent=MSG[r&&r.raison]||'Envoi impossible pour l’instant. Réessaie dans un moment.'; bt.disabled=false; bt.textContent='Envoyer à '+prenom; return; }
            var p=String(d.prenom).trim().split(' ')[0];
            f.outerHTML='<div class="merci">'+esc(accueil.replace(/\{pr[ée]nom\}/gi,p))+'<small>'+prenom+(r.deja?' · ta demande était déjà arrivée.':'')+'</small></div>';
          })
          .catch(function(){ err.textContent='Envoi impossible pour l’instant. Réessaie dans un moment.'; bt.disabled=false; bt.textContent='Envoyer à '+prenom; });
      });
    });
    // LA VISITE : une par appareil et par jour, pour que le coach sache si sa
    // page travaille. Ni cookie, ni identifiant.
    try{ var kv='rc_vv_'+slug+'_'+new Date().toISOString().slice(0,10);
      if(!localStorage.getItem(kv)){ localStorage.setItem(kv,'1'); fetch(SERVEUR+'/vitrine-vue?s='+encodeURIComponent(slug),{mode:'no-cors',keepalive:true}).catch(function(){}); } }catch(e){}
  }
  function vide(t){z.removeAttribute('aria-busy');z.innerHTML='<div class="introuvable"><img src="/app/img/vente/logo-72.webp" width="64" height="64" alt="RepCore"><h1>Page introuvable</h1><p>'+esc(t)+'</p><a class="cta" href="'+racine+'i/">Découvrir RepCore</a></div>';}
  if(!/^[a-z0-9][a-z0-9-]{1,38}[a-z0-9]$/.test(slug)) return vide('Cette page n’existe pas.');
  var ctrl=window.AbortController?new AbortController():null;
  setTimeout(function(){ if(ctrl) ctrl.abort(); },6000);
  // LES PRIX SONT LUS DANS tarifs.json, le tableau des offres, JAMAIS RECOPIES
  // dans la vitrine : la vitrine ne porte que les CLES des formules choisies par
  // le coach. Tableau illisible : les formules ne s'affichent pas, plutot qu'un
  // prix faux.
  var tarifs=fetch(racine+'tarifs.json').then(function(r){ return r.ok?r.json():null; }).catch(function(){ return null; });
  fetch(DB+'/vitrines/'+encodeURIComponent(slug)+'.json',ctrl?{signal:ctrl.signal}:{})
    .then(function(r){ return r.ok?r.json():null; })
    .then(function(v){ return tarifs.then(function(T){ return {v:v,T:T}; }); })
    .then(function(x){ var v=x.v, T=x.T;
      if(!v||!v.nom) return vide('Cette page n’existe pas, ou ce coach ne la publie plus.');
      var nom=esc(v.nom), prenom=esc(String(v.nom).split(' ')[0]);
      document.title=v.nom+' : coaching sur RepCore';
      var h='';
      if(https(v.photo)) h+='<img class="photo" src="'+https(v.photo)+'" alt="'+nom+'" width="128" height="128">';
      h+='<h1>'+nom+'</h1>';
      if(v.equipe) h+='<div class="equipe">'+esc(v.equipe)+'</div>';
      if(v.phrase) h+='<p class="phrase">« '+esc(v.phrase)+' »</p>';
      var sp=v.specialites?Object.keys(v.specialites).map(function(k){return v.specialites[k];}):[];
      if(sp.length) h+='<div class="puces">'+sp.map(function(x){return '<span>'+esc(x)+'</span>';}).join('')+'</div>';
      if(v.bio) h+='<h2>Mon parcours</h2><div class="txt">'+esc(v.bio)+'</div>';
      if(v.vision) h+='<h2>Ma méthode</h2><div class="txt">'+esc(v.vision)+'</div>';
      var pr=v.programmes?Object.keys(v.programmes).map(function(k){return v.programmes[k];}):[];
      if(pr.length) h+='<h2>Programmes</h2>'+pr.map(function(p){
        return '<div class="prog">'+(https(p.visuel)?'<img src="'+https(p.visuel)+'" alt="" loading="lazy">':'')
          +'<div><b>'+esc(p.name)+'</b>'+(p.pitch?'<p>'+esc(p.pitch)+'</p>':'')
          +'<div class="ligne"><span class="prix">'+esc(p.prix||'')+'</span>'
          +(https(p.lienAchat)?'<a href="'+https(p.lienAchat)+'" target="_blank" rel="noopener noreferrer">Voir le programme</a>':'')
          +'</div></div></div>';}).join('');
      var fk=v.formules?Object.keys(v.formules).map(function(k){return v.formules[k];}):[];
      var C=(T&&T.coaching)||{};
      fk=fk.filter(function(k){ return C[k]&&typeof C[k].prix==='number'&&C[k].lib; });
      if(fk.length){
        h+='<h2>Mes formules</h2>'+fk.map(function(k){
          var f=C[k];
          return '<div class="frm" data-f="'+esc(k)+'"><b>'+esc(f.lib)+'</b>'+(f.comprend?'<p>'+esc(f.comprend)+'</p>':'')
            +'<div class="ligne"><span><span class="prix">'+euros(f.prix)+'</span> <span class="duree">'+esc(duree(k,f))+'</span></span>'
            +'<span class="gestes">'+(v.paiement===true?'<a class="payer" href="'+racine+'app/?payer='+encodeURIComponent(slug+'~'+k)+'">Payer</a>':'')
            +'<button type="button" class="interesse">Ça m’intéresse</button></span></div>'
            +'<form novalidate><input name="prenom" autocomplete="given-name" maxlength="30" placeholder="Ton prénom" aria-label="Ton prénom">'
            +'<input name="contact" autocomplete="tel" maxlength="120" placeholder="Ton téléphone ou ton e-mail" aria-label="Ton téléphone ou ton e-mail">'
            +'<input name="site" class="piege" tabindex="-1" autocomplete="off" aria-hidden="true">'
            +'<p class="err" aria-live="polite"></p>'
            +'<button type="submit" class="env">Envoyer à '+prenom+'</button>'
            +'<p class="note">Aucun paiement ici. '+prenom+' te répond, vous faites connaissance, et tu décides ensuite. Ton prénom et ton contact ne servent qu’à ça.</p></form></div>';
        }).join('');
      }
      var src=(q.get('src')||'vitrine').replace(/[^a-z0-9_-]/gi,'').slice(0,20);
      var ref=(q.get('ref')||'').toUpperCase();
      h+='<a class="cta" href="'+racine+'i/?coach='+encodeURIComponent(slug)+'&src='+src
        +(/^[A-Z]{4,6}[A-Z2-9]{3}$/.test(ref)?'&ref='+ref:'')+'">Commencer avec '+prenom+'</a>';
      h+='<div class="pied"><a href="'+racine+'">RepCore</a> · le coaching, séance après séance.</div>';
      z.removeAttribute('aria-busy'); z.innerHTML=h;
      brancherFormules(v,prenom);
    })
    .catch(function(){ vide('Page injoignable pour l’instant. Réessaie dans un moment.'); });
})();
</script>
<script>
// L'ARRIVEE (attribution) : src, amb, et le SEUL fait qu'un code parrain etait
// la (ref=1, jamais le code : il designe une personne). Une fois par jour et
// par lien sur cet appareil (localStorage, premiere partie) ; ni cookie, ni
// IP, ni identifiant. La fonction attribArrivee ne repond rien : absente
// (plan Spark), rien ne casse.
(function(){try{var p=new URLSearchParams(location.search);
var src=(p.get('src')||'vitrine').toLowerCase().replace(/[^a-z0-9_-]/g,'').slice(0,20);
var amb=(p.get('amb')||'').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,16);
var ref=p.get('ref')?1:0;
var k='rc_attr_'+new Date().toISOString().slice(0,10)+'_'+(src||'-')+'_'+(amb||'-');
if(localStorage.getItem(k)) return; localStorage.setItem(k,'1');
fetch('https://repcore-serveur.repcore.workers.dev/arrivee?src='+encodeURIComponent(src)+(amb?'&amb='+amb:'')+(ref?'&ref=1':''),{mode:'no-cors',keepalive:true}).catch(function(){});
}catch(e){}})();
</script>
</body>
</html>
