# Le serveur léger de RepCore : un Cloudflare Worker sur le plan GRATUIT.
# Voir cloudflare/README.md pour l'installation (compte, secrets, déploiement).
name = "repcore-serveur"
main = "src/index.js"
compatibility_date = "2026-09-01"

# UNE seule tâche programmée, chaque minute (le plan gratuit en permet cinq).
# Tout le reste — heures de Paris, lots, reprises — est décidé dans planif.js.
[triggers]
crons = ["* * * * *"]

# /arrivee et /amb-clic : 30 appels par minute et par adresse IP, au-delà 429.
# L'API de limitation des Workers (gratuite) ; voir README, « Limites ».
[[ratelimits]]
name = "LIMITE_ARRIVEES"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

[vars]
FIREBASE_DB_URL = "https://repcore-sync-default-rtdb.firebaseio.com"
# La clé PUBLIQUE VAPID : la même que VAPID_PUBLIQUE dans l'app.
VAPID_PUBLIC_KEY = "BLOS0J9PpSZcViPM4ySSKDd0Ss-rnuo8yhmdqpvyhAE6s_HQvSM7QK5nIs329I-4tbix3-8S_3Kl3L3Z0pnf3-4"
# L'identifiant PUBLIC de l'application PayPal : le même que client-id dans l'app.
PAYPAL_CLIENT_ID = "AS9pdM1fxqdyzKzvuiQB3mTPAIHZW12rW_KWAOKB8XkalJXV8kEyWWBzwHPUxCBZtMMzqjJNnAjfa1f1"
# LES MODÈLES D'E-MAIL BREVO (11/10/2026, créés dans le compte de Kevin) : le
# serveur les envoie lui-même (brevo.js, envoyerModele). Secret : BREVO_API_KEY.
BREVO_MODELE_RENOUVELLEMENT = "10"
