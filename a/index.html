<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Mon suivi ambassadeur · RepCore</title>
<!-- LA PAGE DE SUIVI D'UN AMBASSADEUR, en lecture seule : a/?s=<secret>.
     Le secret (24 caracteres) EST l'acces : /ambassadeurs_vue/<secret> est
     lisible par qui le connait, et n'est listable par personne. La page lit ce
     seul noeud — un resume (entonnoir, chiffre d'affaires, commissions par
     mois), recalcule par les Cloud Functions a chaque evenement et chaque
     matin. noindex, et aucun referent envoye : le secret ne fuit pas vers un
     autre site. -->
<link rel="preconnect" href="https://repcore-sync-default-rtdb.firebaseio.com" crossorigin>
<style>
:root{--rouge:#E02020;--fond:#0b0b0c;--carte:#151518;--bord:#2a2a2e;--gris:#a1a1aa}
*{box-sizing:border-box}
html,body{margin:0;background:var(--fond);color:#fff;font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
main{max-width:560px;margin:0 auto;padding:26px 16px calc(28px + env(safe-area-inset-bottom,0px))}
.sur{color:var(--rouge);font-weight:800;letter-spacing:2.5px;font-size:12px;text-transform:uppercase}
h1{margin:4px 0 2px;font-size:28px}
.code{color:var(--gris);font-size:14px}
.ent{display:flex;align-items:center;gap:4px;margin:18px 0;background:var(--carte);border:1px solid var(--bord);border-radius:14px;padding:14px 8px}
.ent div{flex:1;text-align:center}.ent b{display:block;font-size:30px;line-height:1}.ent span{font-size:12px;color:var(--gris)}
.ent i{font-style:normal;font-size:11px;color:var(--gris)}
.grille{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grille div{background:var(--carte);border:1px solid var(--bord);border-radius:12px;padding:12px}
.grille span{display:block;font-size:12px;color:var(--gris)}.grille b{font-size:20px}
.due{color:#ffd23a}
h2{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--gris);margin:24px 0 8px}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:8px 4px;border-bottom:1px solid var(--bord);text-align:right}
th:first-child,td:first-child{text-align:left}
th{color:var(--gris);font-weight:600;font-size:12px}
.lien{display:flex;gap:8px;margin-top:8px}
.lien input{flex:1;min-width:0;background:var(--carte);border:1px solid var(--bord);border-radius:10px;color:#fff;padding:10px;font-size:13px}
.lien button{background:var(--rouge);color:#fff;border:0;border-radius:10px;padding:0 14px;font-weight:800}
.note{color:var(--gris);font-size:12.5px;line-height:1.55;margin-top:18px}
.vide{text-align:center;padding:60px 10px;color:var(--gris)}
</style>
</head>
<body>
<main id="m"><div class="vide">Chargement…</div></main>
<script>
(function(){
  var DB='https://repcore-sync-default-rtdb.firebaseio.com';
  var s=(new URLSearchParams(location.search).get('s')||'').toLowerCase();
  var z=document.getElementById('m');
  function esc(x){return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
  function eur(v){ try{ return Number(v||0).toLocaleString('fr-FR',{style:'currency',currency:'EUR'}); }catch(e){ return (v||0)+' €'; } }
  function pct(a,b){ return b>0?Math.round(a/b*100)+' %':'—'; }
  if(!/^[a-z0-9]{24}$/.test(s)){ z.innerHTML='<div class="vide">Lien incomplet.</div>'; return; }
  fetch(DB+'/ambassadeurs_vue/'+s+'.json').then(function(r){ return r.ok?r.json():null; }).then(function(v){
    if(!v||!v.code){ z.innerHTML='<div class="vide">Ce lien de suivi n’existe pas.</div>'; return; }
    var base=location.origin+location.pathname.replace(/a\/(index\.html)?$/,'');
    var lien=base+'?amb='+encodeURIComponent(v.code);
    var h='<div class="sur">Ambassadeur RepCore</div><h1>'+esc(v.nom||v.code)+'</h1>'
      +'<div class="code">Code '+esc(v.code)+(v.actif===false?' · <b style="color:#ff6b6b">désactivé</b>':'')+'</div>'
      +'<div class="lien"><input readonly value="'+esc(lien)+'" aria-label="Ton lien"><button type="button" id="cp">Copier</button></div>'
      +'<div class="ent"><div><b>'+(v.clics|0)+'</b><span>clics</span></div><i>→ '+pct(v.inscrits,v.clics)+'</i>'
      +'<div><b>'+(v.inscrits|0)+'</b><span>inscrits</span></div><i>→ '+pct(v.payants,v.inscrits)+'</i>'
      +'<div><b>'+(v.payants|0)+'</b><span>payants</span></div></div>'
      +'<div class="grille"><div><span>Chiffre d’affaires</span><b>'+eur(v.ca)+'</b></div>'
      +'<div><span>Commission due</span><b class="due">'+eur(v.due)+'</b></div>'
      +'<div><span>Déjà payée</span><b>'+eur(v.payee)+'</b></div>'
      +'<div><span>En attente (30 jours)</span><b>'+eur(v.attente)+'</b></div></div>';
    var ms=Object.keys(v.mois||{}).sort().reverse();
    if(ms.length) h+='<h2>Par mois</h2><table><tr><th>Mois</th><th>CA</th><th>Due</th><th>Payée</th><th>Attente</th></tr>'
      +ms.map(function(m){ var x=v.mois[m]; return '<tr><td>'+esc(m)+'</td><td>'+eur(x.ca)+'</td><td>'+eur(x.due)+'</td><td>'+eur(x.payee)+'</td><td>'+eur(x.attente)+'</td></tr>'; }).join('')+'</table>';
    h+='<p class="note">Ceux qui s’inscrivent avec ton lien ou ton code ont 1 mois de plus pour essayer. Tu touches '+(v.commissionPct|0)+' % de ce qu’ils paient'
      +(v.palierPct?' ('+(v.palierPct|0)+' % au-delà de '+(v.palierSeuil|0)+' payants)':'')+', pendant '+(v.dureeMois|0)+' mois à partir de leur premier paiement. '
      +'Une commission devient due 30 jours après le paiement (délai des remboursements), et se règle chaque mois.'
      +(v.maj?'<br>Mis à jour le '+esc(new Date(v.maj).toLocaleString('fr-FR'))+'.':'')+'</p>';
    z.innerHTML=h;
    document.getElementById('cp').onclick=function(){ var b=this; try{ navigator.clipboard.writeText(lien).then(function(){ b.textContent='Copié ✓'; }); }catch(e){} };
  }).catch(function(){ z.innerHTML='<div class="vide">Page injoignable pour l’instant.</div>'; });
})();
</script>
</body>
</html>
